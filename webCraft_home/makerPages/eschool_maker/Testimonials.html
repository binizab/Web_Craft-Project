<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Testimonial Creator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #020617;
            --card: rgba(30, 41, 59, 0.7);
            --blue: #3b82f6;
            --text: #f8fafc;
            --border: rgba(59, 130, 246, 0.2);
            --error: #f43f5e;
            --glass: blur(16px);
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            background: radial-gradient(circle at top, #1e1b4b, #020617);
            color: var(--text);
            margin: 0; padding: 20px; min-height: 100vh;
        }

        /* --- Brand Story Section --- */
        .brand-story-container {
            max-width: 1000px; margin: 0 auto 40px auto;
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; background: var(--card);
            backdrop-filter: var(--glass); padding: 30px;
            border-radius: 24px; border: 1px solid var(--border);
        }

        .field-group { display: flex; flex-direction: column; gap: 8px; }
        .field-group.full-width { grid-column: span 3; }

        .field-label { font-size: 0.75rem; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

        textarea, .input-field {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px; color: white;
            padding: 12px; resize: none; outline: none;
        }
        textarea:focus , input:focus { border-color: var(--blue); }

        /* --- Validation & Height Logic --- */
        .upload-card.has-error { border-color: var(--error) !important; box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); }
        
        .error-list { 
            max-height: 0; overflow: hidden; 
            margin-top: 0; opacity: 0;
            display: flex; flex-direction: column; gap: 5px;
            text-align: left; padding: 0 10px;
        }

        /* When card has error, expand the error-list height */
        .upload-card.has-error .error-list { 
            max-height: 200px; margin-top: 15px; opacity: 1; 
        }

        .error-text { color: var(--error); font-size: 0.7rem; display: none; align-items: center; gap: 8px; font-weight: 500; }
        
        .err-img-miss .msg-img, .err-name-miss .msg-name, 
        .err-role-miss .msg-role, .err-quote-miss .msg-quote, 
        .err-quote-short .msg-short { display: flex; }

        /* --- Swiper & Cards --- */
        .swiper { width: 100%; padding: 80px 0 60px 0; }
        .swiper-slide { width: 340px; height: auto; }

        .school-card {
            background: var(--card); backdrop-filter: var(--glass);
            border-radius: 28px; padding: 35px 20px 20px 20px;
            text-align: center; border: 1px solid var(--border);
            height: auto; /* Dynamic Height */
            display: flex; flex-direction: column;
        }

        .profile-wrapper {
            position: relative; width: 100px; height: 100px;
            margin: -85px auto 20px auto; cursor: pointer;
        }

        .profile-img {
            width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid var(--blue); background: #0f172a;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .input-field { text-align: center; margin-bottom: 10px; width: 100%; font-size: 0.9rem; }
        .quote-input { min-height: 100px; font-style: italic; color: #cbd5e1; }

        /* --- Responsive Controls --- */
        .controls {
            position: sticky; top: 20px; z-index: 1000;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            padding: 15px 25px; border-radius: 50px;
            max-width: 95%; margin: 0 auto 20px auto;
            border: 1px solid var(--border);
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
        }

        button {
            padding: 10px 24px; border-radius: 14px; border: none;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px;
        }

        .refresh-btn { background: #334155; color: white; padding: 10px 24px; border-radius: 14px; border: none;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px;}

        @media (max-width: 768px) {
            .brand-story-container { grid-template-columns: 1fr; }
            .controls { border-radius: 20px; flex-direction: column; width: 100%; }
            .controls button { width: 100%; justify-content: center; }
            .swiper-slide { width: 300px; }
        }
    </style>
</head>
<body>

    <div class="brand-story-container">
        <div class="field-group full-width">
            <span class="field-label"><i class="fa-solid fa-book-open"></i> Brand Narrative</span>
            <textarea placeholder="Tell your brand's journey..."></textarea>
        </div>
        <div class="field-group">
            <span class="field-label"><i class="fa-solid fa-wand-magic-sparkles"></i> Vision</span>
            <textarea placeholder="Future goals..."></textarea>
        </div>
        <div class="field-group">
            <span class="field-label"><i class="fa-solid fa-shield-halved"></i> Mission</span>
            <textarea placeholder="Our purpose..."></textarea>
        </div>
        <div class="field-group">
            <span class="field-label"><i class="fa-solid fa-star"></i> Values</span>
            <textarea placeholder="Core principles..."></textarea>
        </div>
    </div>

    <div class="controls">
        <div style="font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-grip"></i> CARDS: 
            <input type="number" id="cardCount" value="3" min="1" max="15" style="background:rgba(255,255,255,0.1); border:none; color:white; width:50px; text-align:center; border-radius: 8px; padding: 5px;">
        </div>
        <button class="refresh-btn" onclick="updateSwiper()"><i class="fa-solid fa-arrows-rotate"></i> Reset Grid</button>
    </div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="swiper-wrapper"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        let swiperInstance = null;

        function updateSwiper() {
            const wrapper = document.getElementById('swiper-wrapper');
            let count = Math.min(parseInt(document.getElementById('cardCount').value) || 1, 15);

            if (swiperInstance) swiperInstance.destroy(true, true);
            wrapper.innerHTML = ''; 

            for (let i = 0; i < count; i++) {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `
                    <div class="school-card upload-card" id="card-${i}">
                        <div class="profile-wrapper" onclick="triggerUpload(${i})">
                            <div class="profile-img" id="img-preview-${i}">
                                <i class="fa-solid fa-camera" style="font-size:24px; color:#3b82f6"></i>
                            </div>
                            <input type="file" id="file-input-${i}" style="display:none" accept="image/*" onchange="previewImage(event, ${i})">
                        </div>
                        
                        <input type="text" class="input-field name-in" placeholder="User Name">
                        <input type="text" class="input-field role-in" style="color:#3b82f6; font-size:11px; font-weight:700" placeholder="JOB POSITION">
                        <textarea class="input-field quote-in quote-input" placeholder="Enter testimonial..."></textarea>

                        <div class="error-list">
                            <div class="error-text msg-img"><i class="fa-solid fa-circle-image"></i> Select an image</div>
                            <div class="error-text msg-name"><i class="fa-solid fa-user-pen"></i> Name is required</div>
                            <div class="error-text msg-role"><i class="fa-solid fa-briefcase"></i> Role is required</div>
                            <div class="error-text msg-quote"><i class="fa-solid fa-message"></i> Testimonial required</div>
                            <div class="error-text msg-short"><i class="fa-solid fa-triangle-exclamation"></i> Must be more than 5 words</div>
                        </div>
                    </div>
                `;
                wrapper.appendChild(slide);
            }

            swiperInstance = new Swiper(".mySwiper", {
                effect: "coverflow",
                centeredSlides: true,
                slidesPerView: "auto",
                autoHeight: true, // Swiper adjusts to the tallest card automatically
                coverflowEffect: { rotate: 0, stretch: 0, depth: 100, modifier: 2, slideShadows: false },
                pagination: { el: ".swiper-pagination", clickable: true },
                navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            });
        }

        function triggerUpload(i) { document.getElementById(`file-input-${i}`).click(); }

        function previewImage(event, i) {
            const preview = document.getElementById(`img-preview-${i}`);
            const card = document.getElementById(`card-${i}`);
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                    card.classList.remove('err-img-miss');
                    checkCardBorder(card);
                    swiperInstance.updateAutoHeight(); // Recalculate Swiper height
                };
                reader.readAsDataURL(file);
            }
        }

        function checkCardBorder(card) {
            const errs = ['err-img-miss', 'err-name-miss', 'err-role-miss', 'err-quote-miss', 'err-quote-short'];
            if (!errs.some(cls => card.classList.contains(cls))) card.classList.remove('has-error');
        }

        function validateFull() {
            let errorFound = false;
            document.querySelectorAll('.upload-card').forEach(card => {
                const hasImg = card.querySelector('img') !== null;
                const name = card.querySelector('.name-in').value.trim();
                const role = card.querySelector('.role-in').value.trim();
                const quote = card.querySelector('.quote-in').value.trim();
                const words = quote === "" ? 0 : quote.split(/\s+/).filter(w => w.length > 0).length;

                card.classList.remove('has-error', 'err-img-miss', 'err-name-miss', 'err-role-miss', 'err-quote-miss', 'err-quote-short');

                if (!hasImg) card.classList.add('err-img-miss');
                if (name === "") card.classList.add('err-name-miss');
                if (role === "") card.classList.add('err-role-miss');
                
                if (quote === "") {
                    card.classList.add('err-quote-miss');
                } else if (words <= 5) {
                    card.classList.add('err-quote-short');
                }

                // If card contains any "err-" class, add "has-error"
                if ([...card.classList].some(c => c.startsWith('err-'))) {
                    card.classList.add('has-error');
                    errorFound = true;
                }
            });

            // Update swiper to accommodate new error heights
            if (swiperInstance) swiperInstance.updateAutoHeight();

        }

        updateSwiper();
    </script>
</body>
</html>
