<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Input Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #6366f1;
            --primary-light: #eef2ff;
            --bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #f8fafc;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .custom-select-wrapper { position: relative; user-select: none; }

        .select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .select-trigger:hover { border-color: var(--primary); }
        .select-trigger.active { border-color: var(--primary); background: var(--primary-light); }

        .trigger-content { display: flex; align-items: center; gap: 12px; }
        .trigger-content i { color: var(--text-muted); width: 18px; height: 18px; }

        .options-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            z-index: 100;
            overflow: hidden;
            display: none;
            animation: slideDown 0.2s ease-out;
        }

        .options-menu.show { display: block; }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-item:hover { background: var(--primary-light); color: var(--primary); }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="card">
        <label>1. Project Category</label>
        <div class="custom-select-wrapper">
            <div class="select-trigger" onclick="toggleMenu('menu1', this)">
                <div class="trigger-content">
                    <i data-lucide="layout"></i>
                    <span class="selected-label">Web Development</span>
                </div>
                <i data-lucide="chevron-down" style="width: 16px;"></i>
            </div>
            <div class="options-menu" id="menu1">
                <div class="option-item" data-icon="layout">Web Development</div>
                <div class="option-item" data-icon="palette">Design Sync</div>
                <div class="option-item" data-icon="megaphone">Marketing</div>
            </div>
        </div>
    </div>

    <div class="card">
        <label>2. Priority Level</label>
        <div class="custom-select-wrapper">
            <div class="select-trigger" onclick="toggleMenu('menu2', this)">
                <div class="trigger-content">
                    <i data-lucide="alert-circle"></i>
                    <span class="selected-label">Medium Priority</span>
                </div>
                <i data-lucide="chevron-down" style="width: 16px;"></i>
            </div>
            <div class="options-menu" id="menu2">
                <div class="option-item" data-icon="zap">High Priority</div>
                <div class="option-item" data-icon="alert-circle">Medium Priority</div>
                <div class="option-item" data-icon="clock">Low Priority</div>
            </div>
        </div>
    </div>

    <div class="card">
        <label>3. Assignee Team</label>
        <div class="custom-select-wrapper">
            <div class="select-trigger" onclick="toggleMenu('menu3', this)">
                <div class="trigger-content">
                    <i data-lucide="users"></i>
                    <span class="selected-label">Product Team</span>
                </div>
                <i data-lucide="chevron-down" style="width: 16px;"></i>
            </div>
            <div class="options-menu" id="menu3">
                <div class="option-item" data-icon="users">Product Team</div>
                <div class="option-item" data-icon="code">Engineering</div>
                <div class="option-item" data-icon="heart">Customer Success</div>
            </div>
        </div>
    </div>

    <div class="card">
        <label>4. Target Facility</label>
        <div class="custom-select-wrapper">
            <div class="select-trigger" onclick="toggleMenu('menu4', this)">
                <div class="trigger-content">
                    <i data-lucide="factory"></i>
                    <span class="selected-label">Main Factory</span>
                </div>
                <i data-lucide="chevron-down" style="width: 16px;"></i>
            </div>
            <div class="options-menu" id="menu4">
                <div class="option-item" data-icon="factory">Main Factory</div>
                <div class="option-item" data-icon="warehouse">West Warehouse</div>
                <div class="option-item" data-icon="building">Headquarters</div>
            </div>
        </div>
    </div>

    <div class="card">
        <label>5. Branch Location</label>
        <div class="custom-select-wrapper">
            <div class="select-trigger" onclick="toggleMenu('menu5', this)">
                <div class="trigger-content">
                    <i data-lucide="git-branch"></i>
                    <span class="selected-label">North Branch</span>
                </div>
                <i data-lucide="chevron-down" style="width: 16px;"></i>
            </div>
            <div class="options-menu" id="menu5">
                <div class="option-item" data-icon="git-branch">North Branch</div>
                <div class="option-item" data-icon="map-pin">South Branch</div>
                <div class="option-item" data-icon="globe">International</div>
            </div>
        </div>
    </div>

</div>

<script>
    lucide.createIcons();

    function toggleMenu(menuId, trigger) {
        // Close other menus
        document.querySelectorAll('.options-menu').forEach(menu => {
            if(menu.id !== menuId) menu.classList.remove('show');
        });
        document.querySelectorAll('.select-trigger').forEach(trig => {
            if(trig !== trigger) trig.classList.remove('active');
        });

        // Toggle current
        const menu = document.getElementById(menuId);
        menu.classList.toggle('show');
        trigger.classList.toggle('active');
    }

    // Selection Logic
    document.querySelectorAll('.option-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const wrapper = item.closest('.custom-select-wrapper');
            const label = wrapper.querySelector('.selected-label');
            const icon = wrapper.querySelector('.trigger-content i');
            const trigger = wrapper.querySelector('.select-trigger');
            const menu = wrapper.querySelector('.options-menu');

            label.textContent = item.textContent;
            icon.setAttribute('data-lucide', item.getAttribute('data-icon'));
            
            lucide.createIcons();
            menu.classList.remove('show');
            trigger.classList.remove('active');
            e.stopPropagation();
        });
    });

    // Close on click outside
    window.addEventListener('click', (e) => {
        if (!e.target.closest('.custom-select-wrapper')) {
            document.querySelectorAll('.options-menu').forEach(m => m.classList.remove('show'));
            document.querySelectorAll('.select-trigger').forEach(t => t.classList.remove('active'));
        }
    });
</script>

</body>
</html>
