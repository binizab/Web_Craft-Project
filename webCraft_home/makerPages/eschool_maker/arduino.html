<!DOCTYPE html>
<html>
<head>
    <title>Arduino Bluetooth Writer</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #28a745; color: white; margin: 5px; }
        button:disabled { background: #ccc; }
        #log { margin-top: 20px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bluetooth Text Plotter</h2>
    <button id="connect">1. Connect Bluetooth (HC-05)</button><br><br>
    <input type="text" id="textInput" placeholder="Type text here (e.g. HI)">
    <button id="send" disabled>2. Send to Arduino</button>
    <div id="log">Status: Not Connected</div>
</div>

<script>
    let port;
    let writer;

    // Font Map: Defines movements for each letter
    // D=Down, U=Up, X=Move X, Y=Move Y. Numbers are milliseconds.
    const fontMap = {
        'H': "D,Y400,U,Y-200,D,X200,U,Y200,D,Y-400,U,X100",
        'I': "D,Y400,U,X100",
        'L': "D,Y400,U,Y-400,D,X200,U,X100",
        'E': "D,Y400,D,X200,U,X-200,Y-200,D,X150,U,X-150,Y-200,D,X200,U,X100",
        'A': "D,Y400,X200,Y-400,U,Y200,X-200,D,X200,U,X100",
        ' ': "X200" // Space
    };

    document.getElementById('connect').addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            writer = port.writable.getWriter();
            document.getElementById('send').disabled = false;
            document.getElementById('log').innerText = "Status: Connected to HC-05!";
        } catch (err) {
            document.getElementById('log').innerText = "Error: " + err;
        }
    });

    document.getElementById('send').addEventListener('click', async () => {
        const text = document.getElementById('textInput').value.toUpperCase();
        for (let char of text) {
            if (fontMap[char]) {
                const commands = fontMap[char] + ","; // Add comma for Arduino parsing
                document.getElementById('log').innerText = "Writing: " + char;
                await writer.write(new TextEncoder().encode(commands));
                // Wait a bit between letters so Arduino doesn't get overwhelmed
                await new Promise(r => setTimeout(r, 2000)); 
            }
        }
        document.getElementById('log').innerText = "Status: Finished Writing!";
    });
</script>
</body>
</html>
