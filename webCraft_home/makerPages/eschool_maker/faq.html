<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DarkMode FAQ Studio | Lucide Icons • 4 Smart Inputs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1a;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            color: #eef2ff;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .faq-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .faq-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .faq-header p {
            color: #94a3b8;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .four-inputs-panel {
            background: #111827;
            border-radius: 2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #1f2a3e;
        }

        .inputs-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: space-between;
            align-items: flex-end;
        }

        .input-group {
            flex: 1 1 180px;
            min-width: 140px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }

        .input-group label svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border: 1.5px solid #1f2a44;
            border-radius: 1.2rem;
            background: #0f172a;
            transition: 0.2s;
            font-weight: 500;
            color: #f1f5f9;
            outline: none;
        }

        .input-group input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.8rem;
            border-top: 1px solid #1e293b;
            padding-top: 1.5rem;
        }

        .btn {
            border: none;
            background: #1e293b;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: inherit;
            color: #e2e8f0;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background: #334155;
        }

        .btn-accent {
            background: #2d1b3e;
            color: #d9b4ff;
            border: 1px solid #6b21a5;
        }

        .btn-accent:hover {
            background: #3b2c4f;
        }

        .faq-list-section {
            background: transparent;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .section-title h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .faq-stats {
            background: #1e293b;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #a5b4fc;
        }

        .faq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .faq-card {
            background: #111827;
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #1f2a3e;
            display: flex;
            flex-direction: column;
        }

        .faq-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.6);
            border-color: #4f46e5;
        }

        .faq-question {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.75rem;
            word-break: break-word;
            line-height: 1.3;
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
        }

        .faq-answer {
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 1.2rem;
            word-break: break-word;
            flex: 1;
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .faq-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #94a3b8;
            border-top: 1px dashed #1e293b;
            padding-top: 0.8rem;
        }

        .badge {
            background: #1e293b;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .card-actions {
            display: flex;
            gap: 0.7rem;
            justify-content: flex-end;
            margin-top: 0.2rem;
        }

        .icon-btn {
            background: #1e293b;
            border: none;
            font-size: 0.75rem;
            padding: 0.45rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            transition: 0.1s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #e2e8f0;
        }

        .icon-btn.edit {
            background: #312e81;
            color: #c7d2fe;
        }

        .icon-btn.delete {
            background: #450a0a;
            color: #fca5a5;
        }

        .icon-btn.move-up, .icon-btn.move-down {
            background: #1e293b;
            color: #9ca3af;
        }

        .icon-btn:hover {
            filter: brightness(1.2);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: #0f172a;
            border-radius: 2rem;
            color: #94a3b8;
            border: 1px dashed #334155;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #111827;
            max-width: 500px;
            width: 90%;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid #334155;
        }

        .modal-content h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #eef2ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            margin: 0.8rem 0;
            padding: 0.8rem;
            border: 1.5px solid #1f2a44;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 1rem;
            background: #0f172a;
            color: #f1f5f9;
        }

        .modal-content textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .four-inputs-panel {
                padding: 1rem;
            }
            .faq-grid {
                grid-template-columns: 1fr;
            }
            .inputs-grid {
                flex-direction: column;
                align-items: stretch;
            }
            .input-group {
                width: 100%;
            }
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #5f6c84;
        }

        .helper-tip {
            font-size: 0.7rem;
            margin-top: 12px;
            text-align: right;
            color: #7e8aa2;
            background: #0f172a;
            display: inline-block;
            width: 100%;
            border-radius: 20px;
            padding: 0.3rem 1rem;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="faq-header">
        <h1>🌙 DarkMode FAQ Studio</h1>
        <p>Lucide Icons • 4 Dynamic Metrics • Zero Pre-built FAQs</p>
    </div>

    <div class="four-inputs-panel">
        <div class="inputs-grid">
            <div class="input-group">
                <label id="label1">👩‍🏫 Certified Teachers</label>
                <input type="number" id="num1" value="5" step="1" placeholder="Number">
            </div>
            <div class="input-group">
                <label id="label2">🧪 Subject Experts</label>
                <input type="number" id="num2" value="8" step="1" placeholder="Number">
            </div>
            <div class="input-group">
                <label id="label3">📅 Avg. Experience</label>
                <input type="number" id="num3" value="6" step="1" placeholder="Years">
            </div>
            <div class="input-group">
                <label id="label4">⭐ Avg. Rating</label>
                <input type="number" id="num4" value="4" step="0.5" placeholder="1-5">
            </div>
        </div>
        <div class="action-bar">
            <button class="btn btn-primary" id="smartSortBtn">⚡ Smart Sort (Input 1+4)</button>
            <button class="btn btn-accent" id="resetAllFaqsBtn">🗑️ Clear All FAQs</button>
        </div>
       
    </div>

    <div class="faq-list-section">
        <div class="section-title">
            <h2>📌 Frequently Asked Questions</h2>
            <div class="faq-stats" id="faqStats">0 items</div>
        </div>
        <div id="faqContainer" class="faq-grid"></div>
    </div>
</div>

<div id="faqModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">➕ Add New FAQ</h3>
        <input type="text" id="modalQuestion" placeholder="Question (required)" autocomplete="off">
        <textarea id="modalAnswer" placeholder="Answer (required)"></textarea>
        <input type="number" id="modalCustomWeight" placeholder="Priority Weight" value="5">
        <div class="modal-buttons">
            <button class="btn btn-outline" id="closeModalBtn">Cancel</button>
            <button class="btn btn-primary" id="saveModalBtn">Save</button>
        </div>
    </div>
</div>

<!-- Lucide script with proper loading handling -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    // FAQ Data - completely empty
    let faqs = [];
    let nextId = 1;
    let currentDisplayLimit = 10;
    let currentEditId = null;

    // DOM elements
    const num1Input = document.getElementById('num1');
    const num2Input = document.getElementById('num2');
    const num3Input = document.getElementById('num3');
    const num4Input = document.getElementById('num4');
    const faqContainer = document.getElementById('faqContainer');
    const faqStatsSpan = document.getElementById('faqStats');
    const applyLimitBtn = document.getElementById('applyLimitBtn');
    const smartSortBtn = document.getElementById('smartSortBtn');
    const resetAllFaqsBtn = document.getElementById('resetAllFaqsBtn');
    const modal = document.getElementById('faqModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalQuestion = document.getElementById('modalQuestion');
    const modalAnswer = document.getElementById('modalAnswer');
    const modalCustomWeight = document.getElementById('modalCustomWeight');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // SVG icon helper functions - manual Lucide-style icons (no external dependency needed)
    function getIcon(name, size = 16) {
        const icons = {
            'help-circle': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
            'message-square': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
            'sliders': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="12" x2="14" y2="12"/><line x1="18" y1="16" x2="22" y2="16"/></svg>`,
            'hash': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>`,
            'pencil': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-7 7H10v-4l7-7z"/><path d="M4 20h16"/></svg>`,
            'trash': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 4V2h8v2"/></svg>`,
            'arrow-up': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
            'arrow-down': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></svg>`,
            'eye': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
            'zap': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
            'trash-2': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 4V2h8v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
            'plus': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
            'x': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
            'save': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
            'plus-circle': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
            'edit-2': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-7 7H10v-4l7-7z"/><path d="M4 20h16"/></svg>`,
            'info': `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`
        };
        return icons[name] || '';
    }

    function renderFaqs() {
        let itemsToShow = [...faqs];
        let limitedList = itemsToShow.slice(0, currentDisplayLimit);
        
        if (limitedList.length === 0) {
            faqContainer.innerHTML = `<div class="empty-state">
                <div style="font-size: 3rem; margin-bottom: 0.8rem;">📭</div>
                <strong style="color:#cbd5e6;">No FAQs yet</strong><br>
                <span style="color:#7e8aa2;">Click <strong style="background:#4f46e5; padding:0.2rem 0.8rem; border-radius:30px; color:white; display:inline-flex; align-items:center; gap:4px;">${getIcon('plus', 12)} Add New FAQ</strong> to get started</span>
            </div>`;
            faqStatsSpan.innerText = `0 / 0 items`;
            return;
        }

        faqContainer.innerHTML = limitedList.map((faq) => {
            const originalIndex = faqs.findIndex(f => f.id === faq.id);
            const isMoveUpDisabled = originalIndex === 0;
            const isMoveDownDisabled = originalIndex === faqs.length - 1;
            return `
                <div class="faq-card" data-id="${faq.id}">
                    <div class="faq-question">
                        ${getIcon('help-circle', 20)}
                        <span>${escapeHtml(faq.question)}</span>
                    </div>
                    <div class="faq-answer">
                        ${getIcon('message-square', 16)}
                        <span>${escapeHtml(faq.answer)}</span>
                    </div>
                    <div class="faq-meta">
                        <span class="badge">${getIcon('sliders', 12)} weight: ${faq.weight}</span>
                        <span class="badge">${getIcon('hash', 12)} id: ${faq.id}</span>
                    </div>
                    <div class="card-actions">
                        <button class="icon-btn edit" data-id="${faq.id}">${getIcon('pencil', 12)} Edit</button>
                        <button class="icon-btn delete" data-id="${faq.id}">${getIcon('trash', 12)} Del</button>
                        <button class="icon-btn move-up" data-id="${faq.id}" ${isMoveUpDisabled ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>${getIcon('arrow-up', 12)} Up</button>
                        <button class="icon-btn move-down" data-id="${faq.id}" ${isMoveDownDisabled ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>${getIcon('arrow-down', 12)} Down</button>
                    </div>
                </div>
            `;
        }).join('');
        
        faqStatsSpan.innerText = `${limitedList.length} / ${faqs.length} items (limit: ${currentDisplayLimit})`;
        
        // Attach event listeners
        document.querySelectorAll('.icon-btn.edit').forEach(btn => {
            btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-id')));
        });
        document.querySelectorAll('.icon-btn.delete').forEach(btn => {
            btn.addEventListener('click', () => deleteFaqById(btn.getAttribute('data-id')));
        });
        document.querySelectorAll('.icon-btn.move-up').forEach(btn => {
            if (!btn.hasAttribute('disabled')) {
                btn.addEventListener('click', () => moveFaq(btn.getAttribute('data-id'), 'up'));
            }
        });
        document.querySelectorAll('.icon-btn.move-down').forEach(btn => {
            if (!btn.hasAttribute('disabled')) {
                btn.addEventListener('click', () => moveFaq(btn.getAttribute('data-id'), 'down'));
            }
        });
    }

    function moveFaq(id, direction) {
        const index = faqs.findIndex(f => f.id === id);
        if (index === -1) return;
        if (direction === 'up' && index > 0) {
            [faqs[index - 1], faqs[index]] = [faqs[index], faqs[index - 1]];
        } else if (direction === 'down' && index < faqs.length - 1) {
            [faqs[index + 1], faqs[index]] = [faqs[index], faqs[index + 1]];
        } else {
            return;
        }
        renderFaqs();
    }

    function deleteFaqById(id) {
        if (confirm("Delete this FAQ permanently?")) {
            faqs = faqs.filter(f => f.id !== id);
            renderFaqs();
        }
    }

    function openEditModal(id) {
        const faq = faqs.find(f => f.id === id);
        if (!faq) return;
        currentEditId = id;
        modalTitle.innerHTML = `${getIcon('edit-2', 18)} Edit FAQ`;
        modalQuestion.value = faq.question;
        modalAnswer.value = faq.answer;
        modalCustomWeight.value = faq.weight;
        modal.style.display = 'flex';
    }

    function openAddModal() {
        currentEditId = null;
        modalTitle.innerHTML = `${getIcon('plus-circle', 18)} Add New FAQ`;
        modalQuestion.value = '';
        modalAnswer.value = '';
        modalCustomWeight.value = 5;
        modal.style.display = 'flex';
    }

    function saveFaqFromModal() {
        const question = modalQuestion.value.trim();
        const answer = modalAnswer.value.trim();
        if (!question || !answer) {
            alert("Please fill both question and answer.");
            return;
        }
        let weight = parseInt(modalCustomWeight.value);
        if (isNaN(weight)) weight = 0;

        if (currentEditId) {
            const index = faqs.findIndex(f => f.id === currentEditId);
            if (index !== -1) {
                faqs[index].question = question;
                faqs[index].answer = answer;
                faqs[index].weight = weight;
            }
        } else {
            let insertPos = parseInt(num3Input.value);
            if (isNaN(insertPos)) insertPos = faqs.length;
            insertPos = Math.max(0, Math.min(insertPos, faqs.length));
            const newFaq = {
                id: String(nextId++),
                question: question,
                answer: answer,
                weight: weight
            };
            faqs.splice(insertPos, 0, newFaq);
        }
        closeModal();
        renderFaqs();
    }

    function closeModal() {
        modal.style.display = 'none';
        currentEditId = null;
    }

    function smartSort() {
        if (faqs.length === 0) {
            alert("No FAQs to sort. Add some first.");
            return;
        }
        let priorityFactor = parseFloat(num1Input.value);
        let offset = parseFloat(num4Input.value);
        if (isNaN(priorityFactor)) priorityFactor = 1;
        if (isNaN(offset)) offset = 0;
        
        faqs.sort((a, b) => {
            const scoreA = (priorityFactor * a.weight) + offset;
            const scoreB = (priorityFactor * b.weight) + offset;
            if (scoreA !== scoreB) return scoreB - scoreA;
            return b.weight - a.weight;
        });
        renderFaqs();
        showToast(`Sorted using (${priorityFactor} × weight + ${offset})`);
    }

    function applyDisplayLimit() {
        let limitVal = parseInt(num2Input.value);
        if (isNaN(limitVal) || limitVal < 0) limitVal = 0;
        currentDisplayLimit = limitVal;
        renderFaqs();
        showToast(`Display limit set to ${currentDisplayLimit}`);
    }

    function resetAllFaqs() {
        if (faqs.length > 0 && confirm("Delete ALL FAQs? This cannot be undone.")) {
            faqs = [];
            nextId = 1;
            renderFaqs();
            showToast("All FAQs cleared.");
        } else if (faqs.length === 0) {
            alert("No FAQs to clear.");
        }
    }

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '20px';
        toast.style.background = '#1e293b';
        toast.style.color = '#e2e8f0';
        toast.style.padding = '8px 16px';
        toast.style.borderRadius = '40px';
        toast.style.fontSize = '0.8rem';
        toast.style.zIndex = '999';
        toast.style.borderLeft = '3px solid #4f46e5';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // Add floating add button
    const addBtn = document.createElement('button');
    addBtn.innerHTML = `${getIcon('plus', 14)} Add New FAQ`;
    addBtn.className = 'btn btn-primary';
    addBtn.style.marginLeft = 'auto';
    addBtn.id = 'addNewFloatingBtn';
    const titleDiv = document.querySelector('.section-title');
    titleDiv.appendChild(addBtn);
    addBtn.addEventListener('click', openAddModal);

    // Update button icons
    applyLimitBtn.innerHTML = `${getIcon('eye', 14)} Apply Limit (Input 2)`;
    smartSortBtn.innerHTML = `${getIcon('zap', 14)} Smart Sort (Input 1+4)`;
    resetAllFaqsBtn.innerHTML = `${getIcon('trash-2', 14)} Clear All FAQs`;
    closeModalBtn.innerHTML = `${getIcon('x', 14)} Cancel`;
    saveModalBtn.innerHTML = `${getIcon('save', 14)} Save`;

    // Event listeners
    applyLimitBtn.addEventListener('click', applyDisplayLimit);
    smartSortBtn.addEventListener('click', smartSort);
    resetAllFaqsBtn.addEventListener('click', resetAllFaqs);
    closeModalBtn.addEventListener('click', closeModal);
    saveModalBtn.addEventListener('click', saveFaqFromModal);
    window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // Initialize
    function init() {
        let initLimit = parseInt(num2Input.value);
        if (isNaN(initLimit)) initLimit = 10;
        currentDisplayLimit = initLimit;
        renderFaqs();
    }
    init();
</script>
</body>
</html>
