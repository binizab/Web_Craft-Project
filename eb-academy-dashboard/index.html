<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EB Academy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<section id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-head">
      <div class="logo-badge"><i data-lucide="graduation-cap"></i></div>
      <h1>EB Academy</h1>
      <p>Sign in to your dashboard</p>
    </div>
    <form id="loginForm" class="login-form">
      <label>
        <span>Role</span>
        <div class="select-wrap">
          <i data-lucide="user-cog"></i>
          <select id="role" required>
            <option value="">Select role</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </label>
      <label>
        <span>Email</span>
        <div class="input-wrap">
          <i data-lucide="mail"></i>
          <input type="email" id="email" placeholder="you@ebacademy.com" required />
        </div>
      </label>
      <label>
        <span>Password</span>
        <div class="input-wrap">
          <i data-lucide="lock"></i>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
      </label>
      <button type="submit" class="btn-primary">
        <i data-lucide="log-in"></i> Sign in
      </button>
    </form>
    <button class="theme-fab" id="themeFabLogin" aria-label="Toggle theme">
      <i data-lucide="moon"></i>
    </button>
  </div>
</section>

<!-- ============ APP SHELL ============ -->
<div id="appView" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-badge"><i data-lucide="graduation-cap"></i></div>
      <div>
        <div class="brand-title">EB Academy</div>
        <div class="brand-sub" id="brandSub">Dashboard</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#" class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="#" class="nav-item" data-page="books"><i data-lucide="book-open"></i><span>Books</span></a>
      <a href="#" class="nav-item" data-page="exams"><i data-lucide="file-text"></i><span>Exams</span></a>
      <a href="#" class="nav-item" data-page="courses"><i data-lucide="graduation-cap"></i><span>Courses</span></a>
      <a href="#" class="nav-item" data-page="students"><i data-lucide="users"></i><span>Students</span></a>
      <a href="#" class="nav-item" data-page="teachers"><i data-lucide="user-check"></i><span>Teachers</span></a>
      <a href="#" class="nav-item" data-page="schedule"><i data-lucide="calendar"></i><span>Schedule</span></a>
      <a href="#" class="nav-item" data-page="library"><i data-lucide="library"></i><span>Library</span></a>
      <a href="#" class="nav-item" data-page="reports"><i data-lucide="bar-chart-3"></i><span>Reports</span></a>
      <a href="#" class="nav-item" data-page="settings"><i data-lucide="settings"></i><span>Settings</span></a>
    </nav>
    <button class="logout" id="logoutBtn"><i data-lucide="log-out"></i><span>Logout</span></button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <div class="search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search anything..." />
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeFab" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
        <button class="icon-btn"><i data-lucide="bell"></i></button>
        <div class="user-chip">
          <div class="avatar" id="avatar">U</div>
          <div class="user-meta">
            <div class="user-name" id="userName">User</div>
            <div class="user-role" id="userRole">role</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content" id="content"><!-- pages render here --></div>
  </main>
  <div class="overlay" id="overlay"></div>
</div>

<script src="app.js"></script>
</body>
</html>
