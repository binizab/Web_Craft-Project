<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Form Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .navbar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 100px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid var(--border);
            position: sticky;
            top: 20px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .opt-input {
            width: 50px;
            background: #0f172a;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 5px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
        }

        .container { width: 100%; max-width: 650px; margin-top: 40px; }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .header-card { border-top: 8px solid var(--accent-blue); }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            color: white;
            padding: 10px 0;
            outline: none;
            font-family: 'Poppins';
            font-size: 1rem;
        }

        input[type="text"]:focus { border-bottom-color: var(--accent-blue); }

        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins';
            transition: 0.3s;
        }

        .btn-add { background: var(--accent-blue); color: #0b1120; }
        .btn-preview { background: #10b981; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .remove-link {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #ef4444;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <span style="font-size: 0.7rem; color: var(--accent-blue);">OPTS:</span>
        <input type="number" id="optCount" class="opt-input" value="3" min="1">
        <button class="btn btn-add" id="addText">+ Text</button>
        <button class="btn btn-add" id="addRadio">+ Radio</button>
        <button class="btn btn-add" id="addCheck">+ Check</button>
        <button class="btn btn-preview" id="previewBtn">Live Preview ↗</button>
    </div>

    <div class="container" id="builderArea">
        <div class="card header-card">
            <input type="text" id="mainTitle" style="font-size: 1.8rem; font-weight: 600;" value="New Form">
            <input type="text" id="mainDesc" style="color: var(--text-muted); border-bottom: none;" value="Enter description here...">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
