<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Achievement</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .certificate {
            width: 800px; /* Slightly wider for better proportions */
            height: 550px;
            background-color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 10px solid #f0f0f0;
        }

        /* Decorative background shapes */
        .attracter1 {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #3f3ff8, #0000ff, #01014e);
            position: absolute;
            bottom: -100px;
            left: -100px;
            transform: rotate(45deg);
            z-index: 1;
        }

        .attracter2 {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #3f3ff8, #0000ff, #01014e);
            position: absolute;
            top: -100px;
            right: -100px;
            transform: rotate(45deg);
            z-index: 1;
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 50px;
            color: #333;
            font-family: 'Poppins', sans-serif;
        }

        h1 { font-size: 50px; margin-bottom: 10px; color: #01014e; font-weight: 700; }
        p { font-size: 18px; margin: 5px 0; }
        .name { font-size: 35px; font-weight: 600; color: #3f3ff8; margin: 20px 0; border-bottom: 2px solid #eee; display: inline-block; padding: 0 50px; }
        
        .footer {
            margin-top: 50px;
            display: flex;
            justify-content: space-around;
        }
        
        .signature {
            border-top: 1px solid #333;
            width: 150px;
            padding-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="certificate">
        <div class="attracter1"></div>
        <div class="attracter2"></div>

        <div class="content">
            <p style="letter-spacing: 5px; text-transform: uppercase;">Certificate of Completion</p>
            <h1>EXCELLENCE</h1>
            <p>This is to certify that</p>
            <div class="name">John Doe</div>
            <p>has successfully completed the <strong>Web Development Masterclass</strong></p>
            <p>issued on October 24, 2023</p>

            <div class="footer">
                <div class="signature">Program Director</div>
                <div class="signature">Lead Instructor</div>
            </div>
        </div>
    </div>

</body>
</html>
