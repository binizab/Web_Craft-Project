<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiopian School Planner 2018 E.C.</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --card-bg: #112240;
            --text-main: #ccd6f6;
            --accent-blue: #64ffda;
            --border-blue: #233554;
            --color-school: #1e90ff; 
            --color-exam: #ff4d4d;   
            --color-result: #ffcc00; 
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 10px 25px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-save { background: var(--accent-blue); color: var(--bg-dark); }
        .btn-save:hover { background: #45d1b2; transform: scale(1.05); }
        
        .btn-clear { background: transparent; border: 1px solid var(--eth-red); color: #ff4d4d; }
        .btn-clear:hover { background: #ff4d4d; color: white; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .legend-item { display: flex; align-items: center; font-size: 0.85rem; }
        .dot { width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .month-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-blue);
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-blue);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .am-name { color: #fff; font-weight: bold; }
        .en-name { color: var(--accent-blue); font-size: 0.9rem; }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .day-header { color: #8892b0; font-size: 0.75rem; font-weight: bold; padding-bottom: 5px; }

        .day {
            padding: 10px 0;
            background: rgba(35, 53, 84, 0.5);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            user-select: none;
        }

        .day.state-1 { background: var(--color-school); color: white; }
        .day.state-2 { background: var(--color-exam); color: white; }
        .day.state-3 { background: var(--color-result); color: #000; font-weight: bold; }

        .day:hover { border: 1px solid var(--accent-blue); }

        #status-msg {
            text-align: center;
            height: 20px;
            margin-top: 10px;
            color: var(--accent-blue);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>የ2018 ትምህርት ቤት የቀን መቁጠሪያ</h1>
    <div id="status-msg"></div>
</header>

<div class="controls">
    <button class="btn-save" onclick="saveCalendar()">Save Changes</button>
    <button class="btn-clear" onclick="clearCalendar()">Clear All</button>
</div>

<div class="legend">
    <div class="legend-item"><div class="dot" style="background: rgba(35, 53, 84, 0.5)"></div> Default</div>
    <div class="legend-item"><div class="dot" style="background: var(--color-school)"></div> School Day</div>
    <div class="legend-item"><div class="dot" style="background: var(--color-exam)"></div> Exam Day</div>
    <div class="legend-item"><div class="dot" style="background: var(--color-result)"></div> Result Day</div>
</div>

<div class="calendar-grid" id="calendar"></div>

<script>
    const months = [
        {en: "Meskerem", am: "መስከረም"}, {en: "Tikimt", am: "ጥቅምት"},
        {en: "Hidar", am: "ህዳር"}, {en: "Tahsas", am: "ታህሳስ"},
        {en: "Tir", am: "ጥር"}, {en: "Yekatit", am: "የካቲት"},
        {en: "Megabit", am: "መጋቢት"}, {en: "Miazia", am: "ሚያዝያ"},
        {en: "Genbot", am: "ግንቦት"}, {en: "Sene", am: "ሰኔ"},
        {en: "Hamle", am: "ሐምሌ"}, {en: "Nehasse", am: "ነሐሴ"},
        {en: "Pagumē", am: "ጳጉሜ"}
    ];

    const dayLabels = ["S", "M", "T", "W", "T", "F", "S"];
    const container = document.getElementById('calendar');
    
    // Load saved data or start empty
    let savedData = JSON.parse(localStorage.getItem('ethioCalendar2018')) || {};

    function initCalendar() {
        container.innerHTML = '';
        months.forEach((month, mIdx) => {
            const card = document.createElement('div');
            card.className = 'month-card';

            const mHeader = document.createElement('div');
            mHeader.className = 'month-header';
            mHeader.innerHTML = `<span class="am-name">${month.am}</span><span class="en-name">${month.en}</span>`;
            card.appendChild(mHeader);

            const grid = document.createElement('div');
            grid.className = 'days-grid';

            dayLabels.forEach(d => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = d;
                grid.appendChild(h);
            });

            const totalDays = (mIdx === 12) ? 5 : 30;

            for (let d = 1; d <= totalDays; d++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day';
                dayCell.innerText = d;
                
                // Unique key for each day: "monthIndex-dayNumber"
                const dayKey = `${mIdx}-${d}`;
                let state = savedData[dayKey] || 0;
                
                if (state > 0) dayCell.classList.add(`state-${state}`);

                dayCell.onclick = () => {
                    state = (state + 1) % 4;
                    dayCell.classList.remove('state-1', 'state-2', 'state-3');
                    if (state > 0) dayCell.classList.add(`state-${state}`);
                    savedData[dayKey] = state;
                };

                grid.appendChild(dayCell);
            }
            card.appendChild(grid);
            container.appendChild(card);
        });
    }

    function saveCalendar() {
        localStorage.setItem('ethioCalendar2018', JSON.stringify(savedData));
        const msg = document.getElementById('status-msg');
        msg.innerText = "✓ Calendar saved successfully!";
        setTimeout(() => msg.innerText = "", 3000);
    }

    function clearCalendar() {
        if(confirm("Are you sure you want to clear all marked days?")) {
            savedData = {};
            localStorage.removeItem('ethioCalendar2018');
            initCalendar();
        }
    }

    initCalendar();
</script>

</body>
</html>
