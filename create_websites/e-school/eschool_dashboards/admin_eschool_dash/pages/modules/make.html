<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h2 { margin-top: 0; border-left: 4px solid var(--accent); padding-left: 15px; }

        .schedule-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 8px;
        }

        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }

        input {
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 6px;
            transition: 0.2s;
        }

        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--accent); padding: 12px; border-bottom: 2px solid var(--border); font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }

        .btn-add {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s;
        }

        .btn-add:active { transform: scale(0.95); }

        .section-badge {
            display: inline-block;
            background: #334155;
            padding: 4px 10px;
            border-radius: 4px;
            margin: 2px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }

        .section-badge:hover { border-color: var(--danger); color: var(--danger); }
        .section-badge::after { content: '×'; margin-left: 5px; opacity: 0.5; }

        .student-count { width: 100px; text-align: center; }

        .submit-container {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn-submit:hover { background: #059669; }

        .hint { font-size: 0.75rem; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>School Enrollment System</h2>
        
        <div class="schedule-grid">
            <div class="input-group">
                <label>Start Session</label>
                <input type="datetime-local" id="startTime">
            </div>
            <div class="input-group">
                <label>End Session</label>
                <input type="datetime-local" id="endTime">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Grade</th>
                    <th>Action</th>
                    <th>Sections <span class="hint">(Dbl-click to remove)</span></th>
                    <th>Students</th>
                </tr>
            </thead>
            <tbody id="grade-body"></tbody>
        </table>

        <div class="submit-container">
            <button class="btn-submit" onclick="submitData()">Finalize Enrollment</button>
        </div>
    </div>

    <script>
        const grades = [
            "Nursery", "UKG", "LKG", 
            "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", 
            "Grade 6", "Grade 7", "Grade 8", "Grade 9", "Grade 10", 
            "Grade 11", "Grade 12"
        ];

        const tbody = document.getElementById('grade-body');

        grades.forEach((grade, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${grade}</strong></td>
                <td>
                    <button class="btn-add" onclick="addSection(this)">+ Add</button>
                </td>
                <td class="section-container" data-count="0">
                    <span class="empty-text" style="color:#475569 italic">No sections</span>
                </td>
                <td>
                    <input type="number" class="student-count" placeholder="0" min="0">
                </td>
            `;
            tbody.appendChild(row);
        });

        function addSection(btn) {
            const container = btn.closest('tr').querySelector('.section-container');
            const currentCount = parseInt(container.getAttribute('data-count'));
            
            // Limit to 26 sections (A-Z)
            if (currentCount >= 26) return;

            const letter = String.fromCharCode(65 + currentCount);
            
            if (currentCount === 0) container.innerHTML = "";

            const badge = document.createElement('span');
            badge.className = 'section-badge';
            badge.innerText = letter;
            badge.title = "Double-click to delete";
            
            // Double Click to Delete Logic
            badge.ondblclick = function() {
                this.remove();
                recalculateSections(container);
            };

            container.appendChild(badge);
            container.setAttribute('data-count', currentCount + 1);
        }

        function recalculateSections(container) {
            const badges = container.querySelectorAll('.section-badge');
            if (badges.length === 0) {
                container.innerHTML = '<span class="empty-text" style="color:#475569">No sections</span>';
                container.setAttribute('data-count', "0");
                return;
            }

            // Re-index letters so if B is deleted, C becomes B
            badges.forEach((badge, index) => {
                badge.innerText = String.fromCharCode(65 + index);
            });
            container.setAttribute('data-count', badges.length);
        }

        function submitData() {
            const data = {
                start: document.getElementById('startTime').value,
                end: document.getElementById('endTime').value,
                enrollment: []
            };

            document.querySelectorAll('#grade-body tr').forEach(row => {
                const gradeName = row.cells[0].innerText;
                const sections = Array.from(row.querySelectorAll('.section-badge')).map(b => b.innerText);
                const count = row.querySelector('.student-count').value;

                data.enrollment.push({ gradeName, sections, studentCount: count });
            });

            console.log("Submitted Data:", data);
            alert("Enrollment data has been logged to the console!");
        }
    </script>
</body>
</html>
