<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Form Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .navbar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 100px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid var(--border);
            position: sticky;
            top: 20px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .opt-input {
            width: 50px;
            background: #0f172a;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 5px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
        }

        .container { width: 100%; max-width: 650px; margin-top: 40px; }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .header-card { border-top: 8px solid var(--accent-blue); }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            color: white;
            padding: 10px 0;
            outline: none;
            font-family: 'Poppins';
            font-size: 1rem;
        }

        input[type="text"]:focus { border-bottom-color: var(--accent-blue); }

        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins';
            transition: 0.3s;
        }

        .btn-add { background: var(--accent-blue); color: #0b1120; }
        .btn-preview { background: #10b981; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .remove-link {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #ef4444;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <span style="font-size: 0.7rem; color: var(--accent-blue);">OPTS:</span>
        <input type="number" id="optCount" class="opt-input" value="3" min="1">
        <button class="btn btn-add" id="addText">+ Text</button>
        <button class="btn btn-add" id="addRadio">+ Radio</button>
        <button class="btn btn-add" id="addCheck">+ Check</button>
        <button class="btn btn-preview" id="previewBtn">Live Preview ↗</button>
    </div>

    <div class="container" id="builderArea">
        <div class="card header-card">
            <input type="text" id="mainTitle" style="font-size: 1.8rem; font-weight: 600;" value="New Form">
            <input type="text" id="mainDesc" style="color: var(--text-muted); border-bottom: none;" value="Enter description here...">
        </div>
    </div>

    <script>
        // Function to add a question card
function createCard(type) {
    const count = document.getElementById('optCount').value;
    const builderArea = document.getElementById('builderArea');
    
    const card = document.createElement('div');
    card.className = 'card question-card';
    card.setAttribute('data-type', type);

    let content = `<span class="remove-link" onclick="this.parentElement.remove()">REMOVE</span>`;
    content += `<input type="text" class="q-title" placeholder="Untitled Question">`;

    if (type !== 'text') {
        content += `<div style="margin-top:15px">`;
        for (let i = 1; i <= count; i++) {
            content += `
                <div style="margin-bottom:8px; display:flex; align-items:center; gap:10px;">
                    <input type="${type}" disabled>
                    <input type="text" class="opt-val" placeholder="Option ${i}">
                </div>`;
        }
        content += `</div>`;
    } else {
        content += `<input type="text" disabled placeholder="Short answer text" style="opacity:0.3; border-bottom: 1px dashed #334155; margin-top:15px;">`;
    }

    card.innerHTML = content;
    builderArea.appendChild(card);
}

// Function to generate the live form in a new tab
function generatePreview() {
    const title = document.getElementById('mainTitle').value;
    const desc = document.getElementById('mainDesc').value;
    const questions = document.querySelectorAll('.question-card');

    let formHTML = "";

    questions.forEach((q, idx) => {
        const qTitle = q.querySelector('.q-title').value || "Untitled Question";
        const type = q.getAttribute('data-type');
        
        formHTML += `<div style="background:#1e293b; padding:25px; border-radius:12px; margin-bottom:15px; border:1px solid #334155;">
                        <span style="font-weight:600; display:block; margin-bottom:15px;">${qTitle}</span>`;
        
        if (type === 'text') {
            formHTML += `<input type="text" placeholder="Your answer" style="width:100%; background:transparent; border:none; border-bottom:1px solid #334155; color:white; outline:none; padding:10px 0;">`;
        } else {
            const opts = q.querySelectorAll('.opt-val');
            opts.forEach(o => {
                const val = o.value || "Option";
                formHTML += `
                    <label style="display:block; margin:10px 0; color:#94a3b8; cursor:pointer;">
                        <input type="${type}" name="q${idx}"> ${val}
                    </label>`;
            });
        }
        formHTML += `</div>`;
    });

    const fullDoc = `
        <!DOCTYPE html>
        <html>
        <head>
            <title>${title}</title>
            <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
            <style>
                body { background:#0b1120; color:white; font-family:'Poppins'; padding:50px 20px; display:flex; justify-content:center; }
                .wrapper { width:100%; max-width:600px; }
                .head { background:#1e293b; padding:25px; border-radius:12px; margin-bottom:15px; border-top:8px solid #38bdf8; border-left:1px solid #334155; border-right:1px solid #334155; border-bottom:1px solid #334155; }
                h1 { color:#38bdf8; margin:0; }
            </style>
        </head>
        <body>
            <div class="wrapper">
                <div class="head"><h1>${title}</h1><p>${desc}</p></div>
                ${formHTML}
            </div>
        </body>
        </html>`;

    const blob = new Blob([fullDoc], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
}

// Event Listeners
document.getElementById('addText').addEventListener('click', () => createCard('text'));
document.getElementById('addRadio').addEventListener('click', () => createCard('radio'));
document.getElementById('addCheck').addEventListener('click', () => createCard('checkbox'));
document.getElementById('previewBtn').addEventListener('click', generatePreview);
    </script>
</body>
</html>
