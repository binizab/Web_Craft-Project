<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EB Academy | Smart Attendance Tracker</title>
    <!-- Google Fonts: Poppins + Inter fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0a0f1a;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --sidebar-w: 260px;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at 5% 10%, #111827, var(--bg-dark));
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - weeks history */
        .sidebar {
            width: var(--sidebar-w);
            background: rgba(10, 15, 26, 0.9);
            backdrop-filter: blur(8px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 16px;
            z-index: 10;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-left: 8px;
        }
        .sidebar-header i {
            color: var(--accent);
            width: 32px;
            height: 32px;
        }
        .sidebar-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .weeks-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .week-link {
            padding: 12px 16px;
            border-radius: 16px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
        }
        .week-link:hover {
            background: rgba(56, 189, 248, 0.08);
            color: var(--text-main);
            border-color: var(--accent);
            transform: translateX(4px);
        }
        .week-link.active {
            background: var(--accent);
            color: #0a0f1a;
            font-weight: 700;
            border-color: var(--accent);
            box-shadow: 0 6px 12px -6px var(--accent-glow);
        }
        .week-link.active .week-badge {
            background: #0f172a;
            color: var(--accent);
        }
        .week-badge {
            font-size: 0.7rem;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 28px 36px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header with stats */
        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }
        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .title-section h1 span {
            background: var(--accent);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0a0f1a;
        }
        .save-status {
            background: rgba(34, 197, 94, 0.12);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(34,197,94,0.3);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .save-status.show {
            opacity: 1;
        }

        /* Stats cards row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px 20px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            background: rgba(17, 24, 39, 0.9);
        }
        .stat-card .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        .stat-card b {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            font-family: 'Poppins', monospace;
        }

        /* Table styles */
        .table-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow-x: auto;
            box-shadow: 0 12px 30px -15px rgba(0,0,0,0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        th {
            padding: 18px 16px;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 500;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: rgba(56, 189, 248, 0.03);
        }

        /* Status pills */
        .status-pill {
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            min-width: 96px;
            justify-content: center;
            letter-spacing: 0.3px;
        }
        .status-pill.p {
            background: rgba(34, 197, 94, 0.12);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-pill.a {
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-pill.l {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .status-pill:hover {
            filter: brightness(1.1);
            transform: scale(0.96);
        }
        
        /* Student name cell */
        .student-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* responsive */
        @media (max-width: 800px) {
            .sidebar {
                width: 220px;
                padding: 20px 12px;
            }
            .main-content {
                padding: 20px;
            }
            .stats-row {
                gap: 12px;
            }
            .stat-card b {
                font-size: 1.6rem;
            }
            .title-section h1 {
                font-size: 1.4rem;
            }
        }
        @media (max-width: 640px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 12px 16px;
                backdrop-filter: blur(12px);
            }
            .sidebar-header {
                margin-bottom: 0;
                margin-right: 16px;
            }
            .weeks-container {
                flex-direction: row;
                gap: 8px;
                overflow-x: auto;
            }
            .week-link {
                white-space: nowrap;
            }
            .main-content {
                height: calc(100vh - 80px);
            }
            .stats-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <i data-lucide="calendar-check"></i>
        <h2>Attendance Hub</h2>
    </div>
    <div class="weeks-container" id="week-list"></div>
</aside>

<main class="main-content">
    <div class="container">
        <div class="header-stats">
            <div class="title-section">
                <h1>
                    <i data-lucide="clipboard-list" style="width: 28px;"></i>
                    Week <span id="current-week-num">1</span>
                    <span id="week-title-suffix">Attendance</span>
                </h1>
            </div>
            <div id="save-status" class="save-status">
                <i data-lucide="check-circle"></i> <span>Autosaved</span>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label"><i data-lucide="users"></i> Total Students</div>
                <b id="stat-total">0</b>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i data-lucide="trending-up"></i> Attendance Rate</div>
                <b id="stat-avg">0%</b>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i data-lucide="clock"></i> Weekly Lates</div>
                <b id="stat-late">0</b>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                    </tr>
                </thead>
                <tbody id="attendance-body"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // ---------- STUDENTS & WEEK CONFIG ----------
    const students = ["Abebe Bekele", "Kebede Lemma", "Solomon Tesfaye", "Meron Desta", "Hana Alemu"];
    const weeks = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    let currentWeek = 1;

    // Load attendance history from localStorage (persistent)
    let attendanceHistory = JSON.parse(localStorage.getItem('novaAttendData')) || {};

    // Helper: initialize week if missing
    function initWeekData(week) {
        if (!attendanceHistory[week]) {
            attendanceHistory[week] = {};
            students.forEach(s => {
                // Default statuses: all present ("p")
                attendanceHistory[week][s] = ["p", "p", "p", "p", "p"];
            });
        }
    }

    // Save full state to localStorage
    function persistData() {
        localStorage.setItem('novaAttendData', JSON.stringify(attendanceHistory));
        showSaveNotification();
    }

    let saveTimer = null;
    function showSaveNotification() {
        const statusDiv = document.getElementById('save-status');
        statusDiv.classList.add('show');
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            statusDiv.classList.remove('show');
        }, 1800);
    }

    // Render Sidebar week buttons with dynamic icons/stats (mini badges)
    function renderSidebar() {
        const container = document.getElementById('week-list');
        container.innerHTML = '';
        weeks.forEach(w => {
            const weekDiv = document.createElement('div');
            weekDiv.className = `week-link ${w === currentWeek ? 'active' : ''}`;
            // optional summary: count of lates for this week (quick glance)
            let lateCount = 0;
            if (attendanceHistory[w]) {
                Object.values(attendanceHistory[w]).forEach(days => {
                    days.forEach(st => { if (st === 'l') lateCount++; });
                });
            }
            weekDiv.innerHTML = `
                <span><i data-lucide="calendar" style="width: 14px; display: inline-block; vertical-align: middle;"></i> Week ${w}</span>
                ${lateCount > 0 ? `<span class="week-badge">${lateCount}⏱️</span>` : '<span class="week-badge">📋</span>'}
            `;
            weekDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                loadWeek(w);
            });
            container.appendChild(weekDiv);
        });
        // refresh lucide icons inside sidebar
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    // Load selected week data into table
    function loadWeek(week) {
        currentWeek = week;
        initWeekData(currentWeek);
        
        // Update title
        document.getElementById('current-week-num').innerText = currentWeek;
        
        // highlight active sidebar
        renderSidebar();
        
        const tbody = document.getElementById('attendance-body');
        tbody.innerHTML = '';
        
        students.forEach(student => {
            const studentStatuses = attendanceHistory[currentWeek][student];
            if (!studentStatuses) return;
            
            const tr = document.createElement('tr');
            // Student name cell with icon
            const nameCell = document.createElement('td');
            nameCell.className = 'student-name';
            nameCell.innerHTML = `<i data-lucide="user" style="width: 16px;"></i> ${student}`;
            tr.appendChild(nameCell);
            
            // Days: Mon -> Fri (index 0 to 4)
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            studentStatuses.forEach((status, idx) => {
                const td = document.createElement('td');
                td.appendChild(createPillElement(status, student, idx));
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        
        // recalc stats
        calculateStats();
        
        // reinitialize icons inside dynamic content
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    
    // Create pill with click handler (returns DOM element)
    function createPillElement(status, studentName, dayIndex) {
        const statusMap = { 'p': 'PRESENT', 'a': 'ABSENT', 'l': 'LATE' };
        const label = statusMap[status] || 'PRESENT';
        const pillSpan = document.createElement('span');
        pillSpan.className = `status-pill ${status}`;
        pillSpan.innerHTML = `<i data-lucide="${status === 'p' ? 'check-circle' : (status === 'a' ? 'x-circle' : 'clock')}" style="width: 14px;"></i> ${label}`;
        pillSpan.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleStatus(studentName, dayIndex);
        });
        return pillSpan;
    }
    
    // Cycle status: p -> a -> l -> p
    function toggleStatus(studentName, dayIndex) {
        const statuses = attendanceHistory[currentWeek][studentName];
        if (!statuses) return;
        const currentStatus = statuses[dayIndex];
        const cycle = { 'p': 'a', 'a': 'l', 'l': 'p' };
        const newStatus = cycle[currentStatus];
        statuses[dayIndex] = newStatus;
        
        // Update UI: re-render the whole table row for consistency
        refreshCurrentWeekView();
        persistData();
        calculateStats();
    }
    
    // Refresh entire current week UI without resetting scroll (re-render table)
    function refreshCurrentWeekView() {
        const tbody = document.getElementById('attendance-body');
        if (!tbody) return;
        tbody.innerHTML = '';
        students.forEach(student => {
            const studentStatuses = attendanceHistory[currentWeek][student];
            if (!studentStatuses) return;
            const tr = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.className = 'student-name';
            nameCell.innerHTML = `<i data-lucide="user" style="width: 16px;"></i> ${student}`;
            tr.appendChild(nameCell);
            
            studentStatuses.forEach((status, idx) => {
                const td = document.createElement('td');
                td.appendChild(createPillElement(status, student, idx));
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    
    // Calculate and update stats cards
    function calculateStats() {
        const weekData = attendanceHistory[currentWeek];
        if (!weekData) return;
        
        let totalRecords = 0;
        let presentOrLate = 0;
        let latesCount = 0;
        
        Object.values(weekData).forEach(days => {
            days.forEach(status => {
                totalRecords++;
                if (status === 'p' || status === 'l') presentOrLate++;
                if (status === 'l') latesCount++;
            });
        });
        
        const attendanceRate = totalRecords > 0 ? Math.round((presentOrLate / totalRecords) * 100) : 0;
        
        document.getElementById('stat-total').innerText = students.length;
        document.getElementById('stat-avg').innerText = `${attendanceRate}%`;
        document.getElementById('stat-late').innerText = latesCount;
    }
    
    // Force sync for all weeks and initialize defaults for missing weeks
    function initializeAllWeeks() {
        weeks.forEach(w => {
            if (!attendanceHistory[w]) {
                attendanceHistory[w] = {};
                students.forEach(s => {
                    attendanceHistory[w][s] = ["p", "p", "p", "p", "p"];
                });
            } else {
                // ensure each student has 5 days
                students.forEach(s => {
                    if (!attendanceHistory[w][s] || attendanceHistory[w][s].length !== 5) {
                        attendanceHistory[w][s] = ["p", "p", "p", "p", "p"];
                    }
                });
            }
        });
        persistData();
    }
    
    // initial load
    function init() {
        initializeAllWeeks();
        renderSidebar();
        loadWeek(currentWeek);
    }
    
    // expose refresh on window resize (icons)
    window.addEventListener('resize', () => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
    
    init();
</script>
</body>
</html>
