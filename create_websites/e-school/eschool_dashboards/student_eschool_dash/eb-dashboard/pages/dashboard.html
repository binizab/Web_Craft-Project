<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>EB Academy | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css" />
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</head>
<body>
<script>
  renderShell({ active: 'dashboard', title: 'Dashboard' });
  const user = JSON.parse(localStorage.getItem('eb-user'));
  const c = document.getElementById('content');
  c.innerHTML = `
    <h2 class="page-title">Welcome back, ${user.name} 👋</h2>
    <p class="page-sub">Your unified academic workspace — pick a module below or use the sidebar.</p>
    <div class="kpi-grid">
      <div class="kpi"><div class="ic"><i data-lucide="book-open"></i></div><div><div class="label">Books</div><div class="value">128</div></div></div>
      <div class="kpi"><div class="ic"><i data-lucide="clipboard-check"></i></div><div><div class="label">Exams Pending</div><div class="value">3</div></div></div>
      <div class="kpi"><div class="ic"><i data-lucide="calendar-days"></i></div><div><div class="label">Today's Classes</div><div class="value">5</div></div></div>
      <div class="kpi"><div class="ic"><i data-lucide="message-circle"></i></div><div><div class="label">Unread Messages</div><div class="value">12</div></div></div>
    </div>
    <div class="module-grid" id="mods"></div>`;
  const mods = EB_MODULES.filter(m => m.id !== 'dashboard');
  document.getElementById('mods').innerHTML = mods.map(m => `
    <a class="module" href="${m.file}">
      <div class="ic"><i data-lucide="${m.icon}"></i></div>
      <h3>${m.label}</h3>
      <p>Open the ${m.label.toLowerCase()} workspace.</p>
    </a>`).join('');
  lucide.createIcons();
</script>
</body>
</html>
