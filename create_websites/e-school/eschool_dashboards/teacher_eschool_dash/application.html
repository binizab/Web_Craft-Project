<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Employment Application</title>
    <style>
        :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --success: #2c28a6; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 40px 20px; }
        .app-container { max-width: 800px; margin: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .hero-header { background: linear-gradient(135deg, #1f6feb 0%, #0d1117 100%); padding: 40px; text-align: center; }
        .photo-upload-section { margin-top: -60px; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .profile-preview { width: 120px; height: 120px; border-radius: 50%; background: #21262d; border: 4px solid var(--surface); object-fit: cover; }
        .form-content { padding: 40px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .full-width { grid-column: 1 / -1; }
        input, select, textarea { background: #0d1117; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; }
        .btn-submit { width: 100%; background: var(--success); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.3s; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Overlay Styles */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .overlay-content { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; text-align: center; }
        .success-icon { background: #232b86; color: white; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; font-size: 30px; margin: 0 auto 20px; }
        .credential-box { background: #0d1117; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid #30363d; text-align: left; }
        .copy-wrapper { display: flex; gap: 5px; margin-top: 5px; }
        .copy-wrapper input { flex: 1; background: #21262d; border: 1px solid #30363d; padding: 8px; font-family: monospace; font-size: 14px; }
        .copy-wrapper button { background: #30363d; border: none; color: white; padding: 0 15px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="hero-header"><h1>Teacher Application</h1></div>

    <form id="teacherForm" enctype="multipart/form-data">
        <div class="photo-upload-section">
            <img src="https://via.placeholder.com/120" id="profileDisplay" class="profile-preview">
            <label style="color:var(--accent); cursor:pointer; margin-top:10px;" for="photoInput">Upload Photo</label>
            <input type="file" name="photo" id="photoInput" hidden onchange="previewImage(event)" required>
        </div>

        <div class="form-content">
            <div class="form-grid">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>Experience (Years)</label>
                    <input type="number" name="experience" required>
                </div>
                <div class="input-group">
                    <label>Subject</label>
                    <select name="subject">
                        <option>Mathematics</option>
                        <option>Physics</option>
                        <option>English</option>
                    </select>
                </div>
                <div class="input-group full-width">
                    <label>Degree</label>
                    <input type="text" name="degree" placeholder="e.g. Masters in Education">
                </div>
                <div class="input-group full-width">
                    <label>Professional Statement</label>
                    <textarea name="statement" rows="4"></textarea>
                </div>
                <div class="input-group full-width">
                    <label>Academic Papers (PDF)</label>
                    <input type="file" name="docs[]" multiple accept=".pdf">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">Submit Application</button>
        </div>
    </form>
</div>

<div id="successOverlay" class="overlay">
    <div class="overlay-content">
        <div class="success-icon">✔</div>
        <h2>Application Submitted!</h2>
        <p>Please save your credentials for the interview portal.</p>
        
        <div class="credential-box">
            <div class="input-group">
                <label>Username (Full Name)</label>
                <div class="copy-wrapper">
                    <input type="text" id="dispName" readonly>
                    <button type="button" onclick="copyToClipboard('dispName')">Copy</button>
                </div>
            </div>

            <div class="input-group">
                <label>Access Passkey</label>
                <div class="copy-wrapper">
                    <input type="password" id="dispPass" readonly>
                    <button type="button" onclick="togglePass()">👁</button>
                    <button type="button" onclick="copyToClipboard('dispPass')">Copy</button>
                </div>
            </div>
        </div>
        <button class="btn-submit" onclick="window.location.reload()">Close & Finish</button>
    </div>
</div>

<script>
    const teacherForm = document.getElementById('teacherForm');
    const submitBtn = document.getElementById('submitBtn');

    teacherForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // UI Feedback
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const formData = new FormData(this);

        fetch('submit_teacher.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                showSuccess(formData.get('full_name'), data.passkey);
            } else {
                alert("Error: " + data.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Application";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Server connection failed. Make sure teacher_application.php exists.");
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Application";
        });
    });

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = () => { document.getElementById('profileDisplay').src = reader.result; };
        reader.readAsDataURL(event.target.files[0]);
    }

    function showSuccess(name, passkey) {
        document.getElementById('dispName').value = name;
        document.getElementById('dispPass').value = passkey;
        document.getElementById('successOverlay').style.display = 'flex';
    }

    function togglePass() {
        const p = document.getElementById('dispPass');
        p.type = p.type === "password" ? "text" : "password";
    }

    function copyToClipboard(id) {
        const copyText = document.getElementById(id);
        copyText.select();
        copyText.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(copyText.value);
        
        // Simple visual feedback for copy
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = originalText, 1500);
    }
</script>

</body>
</html>
