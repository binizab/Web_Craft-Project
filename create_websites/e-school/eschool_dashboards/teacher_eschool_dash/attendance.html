<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAttend | Student Portal</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: -1px;
            margin: 0;
        }

        .header span { color: var(--accent); }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .stat-card div { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 5px; }
        .stat-card b { font-size: 1.5rem; color: var(--accent); }

        /* Table Design */
        .table-container {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: rgba(56, 189, 248, 0.05);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 18px 20px;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* Attendance Status UI */
        .status-pill {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            min-width: 80px;
            text-align: center;
        }

        .p { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid var(--success); }
        .a { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .l { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); }

        .save-btn {
            margin-top: 25px;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            float: right;
        }

        .save-btn:hover { background: #7dd3fc; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Weekly <span>Attendance</span></h1>
        <div style="color: var(--text-dim)">Week 48: Dec 28 - Jan 03</div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div>Total Students</div>
            <b>24</b>
        </div>
        <div class="stat-card">
            <div>Avg. Attendance</div>
            <b>92%</b>
        </div>
        <div class="stat-card">
            <div>Late Today</div>
            <b>3</b>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
            </thead>
            <tbody id="attendance-body">
                </tbody>
        </table>
    </div>
    
    <button class="save-btn" onclick="saveData()">Save Changes</button>
</div>

<script>
    const students = [
        "Alex Rivera", "Beatrix Kiddo", "Charlie Day", 
        "Dina Prince", "Elliot Alderson", "Fiona Gallagher"
    ];

    const tbody = document.getElementById('attendance-body');

    // Generate table rows
    students.forEach(name => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight: 500;">${name}</td>
            <td>${createPill()}</td>
            <td>${createPill()}</td>
            <td>${createPill()}</td>
            <td>${createPill()}</td>
            <td>${createPill()}</td>
        `;
        tbody.appendChild(tr);
    });

    function createPill() {
        // Default to 'Present'
        return `<span class="status-pill p" onclick="toggleStatus(this)">PRESENT</span>`;
    }

    function toggleStatus(el) {
        if (el.classList.contains('p')) {
            el.className = 'status-pill a';
            el.innerText = 'ABSENT';
        } else if (el.classList.contains('a')) {
            el.className = 'status-pill l';
            el.innerText = 'LATE';
        } else {
            el.className = 'status-pill p';
            el.innerText = 'PRESENT';
        }
    }

    function saveData() {
        alert("Attendance data cached to local storage!");
        // Here you would typically send data to a database
    }
</script>

</body>
</html>
