<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BehaviorTrack | Student Record System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0f1c;
            --surface: #1e293b;
            --surface-light: #2d3a4e;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-dark: #0284c7;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --success: #22c55e;
            --success-dark: #16a34a;
            --warning: #f59e0b;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
            --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0f1c 0%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header-section {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeInDown 0.5s ease;
        }

        .header-section h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 8px;
        }

        /* Stats Cards Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        /* Form Card */
        .record-form {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 32px;
            transition: var(--transition);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input, select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        /* Table Container */
        .log-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            border: 1px solid var(--border);
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            padding: 16px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            backdrop-filter: blur(8px);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        .date-tag {
            color: var(--text-secondary);
            font-family: 'Monaco', monospace;
            font-size: 0.8rem;
        }

        .student-name {
            font-weight: 600;
            color: var(--accent);
        }

        .record-text {
            color: var(--text-primary);
            line-height: 1.4;
        }

        /* Behavior Type Badges */
        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .type-positive {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .type-negative {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .type-neutral {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .del-btn, .edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
        }

        .del-btn {
            color: var(--text-muted);
        }

        .del-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .edit-btn {
            color: var(--text-muted);
        }

        .edit-btn:hover {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            backdrop-filter: blur(12px);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 40px;
            border-left: 4px solid var(--success);
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .stats-row {
                gap: 12px;
            }
            .stat-card {
                padding: 14px;
            }
            .stat-number {
                font-size: 1.4rem;
            }
            td, th {
                padding: 12px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header-section">
        <h1>📋 BehaviorTrack</h1>
        <div class="subtitle">Student Behavior & Incident Recording System</div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-info">
                <h3>Total Records</h3>
                <div class="stat-number" id="totalCount">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-info">
                <h3>Positive Records</h3>
                <div class="stat-number" id="positiveCount">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⚠️</div>
            <div class="stat-info">
                <h3>Needs Attention</h3>
                <div class="stat-number" id="negativeCount">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-info">
                <h3>Unique Students</h3>
                <div class="stat-number" id="studentCount">0</div>
            </div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="record-form">
        <div class="form-grid">
            <div class="input-group">
                <label>👤 Student Name</label>
                <input type="text" id="stuName" placeholder="e.g., Abebe Kebede" autocomplete="off">
            </div>
            <div class="input-group">
                <label>📅 Date</label>
                <input type="date" id="recordDate">
            </div>
            <div class="input-group">
                <label>🏷️ Behavior Type</label>
                <select id="behaviorType">
                    <option value="positive">✅ Positive (Praise, Helpful)</option>
                    <option value="negative">⚠️ Needs Attention (Disruption)</option>
                    <option value="neutral">📝 Neutral (Observation)</option>
                </select>
            </div>
            <div class="input-group">
                <label>📝 Record Description</label>
                <input type="text" id="stuRecord" placeholder="e.g., Helped classmates, Completed all assignments...">
            </div>
            <div>
                <button class="btn-add" onclick="addLog()">
                    ➕ Add Record
                </button>
            </div>
        </div>
    </div>

    <!-- Records Table -->
    <div class="log-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Student</th>
                    <th>Type</th>
                    <th>Record Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <!-- Sample data will be inserted via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Load records from localStorage
    let records = [];

    function loadFromStorage() {
        const stored = localStorage.getItem('behaviorRecords');
        if (stored) {
            records = JSON.parse(stored);
        } else {
            // Sample initial data
            records = [
                {
                    id: Date.now() + 1,
                    name: "Abebe Kebede",
                    date: new Date().toISOString().split('T')[0],
                    type: "positive",
                    record: "Consistently helping peers with Mathematics homework. Excellent teamwork!"
                },
                {
                    id: Date.now() + 2,
                    name: "Selam Tesfaye",
                    date: new Date().toISOString().split('T')[0],
                    type: "positive",
                    record: "Outstanding participation in class discussion and creative writing."
                },
                {
                    id: Date.now() + 3,
                    name: "Michael Bekele",
                    date: new Date(Date.now() - 86400000).toISOString().split('T')[0],
                    type: "negative",
                    record: "Disrupted class during lecture. Had a conversation after class."
                }
            ];
        }
        renderTable();
        updateStats();
    }

    function saveToStorage() {
        localStorage.setItem('behaviorRecords', JSON.stringify(records));
    }

    function addLog() {
        const name = document.getElementById('stuName').value.trim();
        const date = document.getElementById('recordDate').value;
        const type = document.getElementById('behaviorType').value;
        const record = document.getElementById('stuRecord').value.trim();

        if (!name || !record) {
            showToast("Please fill in student name and record description", false);
            return;
        }

        if (!date) {
            showToast("Please select a date", false);
            return;
        }

        const newRecord = {
            id: Date.now(),
            name: name,
            date: date,
            type: type,
            record: record
        };

        records.unshift(newRecord); // Add to top (newest first)
        saveToStorage();
        renderTable();
        updateStats();
        
        // Clear inputs
        document.getElementById('stuName').value = '';
        document.getElementById('stuRecord').value = '';
        document.getElementById('behaviorType').value = 'positive';
        
        showToast(`Record added for ${name}`, true);
    }

    function deleteRecord(id) {
        if (confirm("Are you sure you want to delete this record?")) {
            records = records.filter(r => r.id !== id);
            saveToStorage();
            renderTable();
            updateStats();
            showToast("Record deleted successfully", true);
        }
    }

    function editRecord(id) {
        const record = records.find(r => r.id === id);
        if (record) {
            const newName = prompt("Edit Student Name:", record.name);
            if (newName && newName.trim()) {
                const newRecord = prompt("Edit Record Description:", record.record);
                if (newRecord && newRecord.trim()) {
                    const newType = prompt("Edit Type (positive/negative/neutral):", record.type);
                    if (newType && (newType === 'positive' || newType === 'negative' || newType === 'neutral')) {
                        record.name = newName.trim();
                        record.record = newRecord.trim();
                        record.type = newType;
                        saveToStorage();
                        renderTable();
                        updateStats();
                        showToast("Record updated successfully", true);
                    } else {
                        showToast("Invalid type. Use positive, negative, or neutral", false);
                    }
                }
            }
        }
    }

    function getTypeBadge(type) {
        switch(type) {
            case 'positive':
                return '<span class="type-badge type-positive">✅ Positive</span>';
            case 'negative':
                return '<span class="type-badge type-negative">⚠️ Needs Attention</span>';
            default:
                return '<span class="type-badge type-neutral">📝 Neutral</span>';
        }
    }

    function renderTable() {
        const tbody = document.getElementById('logBody');
        
        if (records.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center;">
                        <div class="empty-state">
                            📭 No records yet<br>
                            <small>Add your first behavior record using the form above</small>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = records.map(record => `
            <tr>
                <td class="date-tag">${record.date}</td>
                <td class="student-name">${escapeHtml(record.name)}</td>
                <td>${getTypeBadge(record.type)}</td>
                <td class="record-text">${escapeHtml(record.record)}</td>
                <td>
                    <div class="action-buttons">
                        <button class="edit-btn" onclick="editRecord(${record.id})" title="Edit">
                            ✏️
                        </button>
                        <button class="del-btn" onclick="deleteRecord(${record.id})" title="Delete">
                            🗑️
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function updateStats() {
        const total = records.length;
        const positive = records.filter(r => r.type === 'positive').length;
        const negative = records.filter(r => r.type === 'negative').length;
        const uniqueStudents = new Set(records.map(r => r.name.toLowerCase())).size;
        
        document.getElementById('totalCount').innerText = total;
        document.getElementById('positiveCount').innerText = positive;
        document.getElementById('negativeCount').innerText = negative;
        document.getElementById('studentCount').innerText = uniqueStudents;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showToast(message, isSuccess = true) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `${isSuccess ? '✅' : '⚠️'} ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // Set default date to today
    document.getElementById('recordDate').valueAsDate = new Date();

    // Initialize
    loadFromStorage();

    // Keyboard shortcut: Enter to add record
    document.getElementById('stuRecord').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addLog();
        }
    });
    document.getElementById('stuName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('stuRecord').focus();
        }
    });
</script>
</body>
</html>
