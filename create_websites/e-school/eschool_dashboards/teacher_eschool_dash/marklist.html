<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EB Academy | Ethiopian Student Marklist</title>
    <!-- Google Fonts: Poppins + Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0c10;
            --card-bg: #11161d;
            --card-hover: #1a212b;
            --border: #2d3748;
            --text-primary: #f0f3f8;
            --text-dim: #8b949e;
            --accent-blue: #3b82f6;
            --accent-gold: #f2cc60;
            --accent-gold-glow: rgba(242, 204, 96, 0.1);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 18px;
        }

        body {
            font-family: 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 5% 20%, #0f141c, var(--bg-deep));
            color: var(--text-primary);
            margin: 0;
            padding: 28px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header with icons */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #fff, var(--accent-gold));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title-section p {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-recalc {
            background: var(--accent-blue);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .btn-recalc:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            gap: 12px;
        }

        /* Table Grid Layout */
        .grid-header {
            display: grid;
            grid-template-columns: 50px minmax(160px, 2fr) repeat(5, 1fr) 100px;
            background: rgba(0, 0, 0, 0.3);
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
            border: 1px solid var(--border);
        }
        .grid-header span {
            text-align: center;
        }
        .grid-header span:first-child {
            text-align: center;
        }
        .grid-header span:nth-child(2) {
            text-align: left;
            padding-left: 8px;
        }

        .student-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Student Row */
        .student-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: grid;
            grid-template-columns: 50px minmax(160px, 2fr) repeat(5, 1fr) 100px;
            align-items: center;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
        }
        .student-row:hover {
            background: var(--card-hover);
            border-color: var(--accent-blue);
            transform: scale(1.01);
            box-shadow: 0 8px 18px rgba(0,0,0,0.3);
        }

        .cell {
            padding: 14px 6px;
            text-align: center;
            border-right: 1px solid rgba(45, 55, 72, 0.4);
        }
        .cell:last-child {
            border-right: none;
        }

        .id-cell {
            font-weight: 600;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }
        .name-cell {
            text-align: left;
            padding-left: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .name-cell i {
            color: var(--accent-gold);
        }

        /* Score Inputs */
        .score-input {
            width: 85%;
            background: #0f1219;
            border: 1px solid var(--border);
            color: var(--accent-blue);
            text-align: center;
            font-family: 'Poppins', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 12px;
            padding: 8px 4px;
            outline: none;
            transition: 0.2s;
        }
        .score-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
            background: #1a202c;
        }
        .score-input::-webkit-inner-spin-button, 
        .score-input::-webkit-outer-spin-button {
            opacity: 0.5;
        }

        .total-cell {
            font-weight: 800;
            font-size: 1.1rem;
            background: var(--accent-gold-glow);
            color: var(--accent-gold);
            border-radius: 0 var(--radius) var(--radius) 0;
            font-family: 'Poppins', monospace;
        }

        .sub-weight {
            display: block;
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* Grade Badge */
        .grade-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 40px;
            background: rgba(0,0,0,0.4);
            margin-left: 6px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 950px) {
            .grid-header, .student-row {
                grid-template-columns: 40px 1.5fr repeat(5, 0.9fr) 90px;
                font-size: 0.75rem;
            }
            .score-input {
                width: 95%;
                font-size: 0.8rem;
            }
            .cell {
                padding: 12px 3px;
            }
            .name-cell {
                padding-left: 6px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 780px) {
            body {
                padding: 16px;
            }
            .grid-header {
                display: none; /* Hide header on very small, use scroll */
            }
            .student-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 16px;
                position: relative;
            }
            .cell {
                border-right: none;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 12px;
                border-bottom: 1px solid var(--border);
                text-align: left;
            }
            .cell:last-child {
                border-bottom: none;
            }
            .name-cell {
                font-size: 1rem;
                justify-content: flex-start;
                gap: 10px;
            }
            .id-cell {
                justify-content: space-between;
            }
            .score-input {
                width: 110px;
                text-align: right;
            }
            .total-cell {
                background: transparent;
                justify-content: space-between;
                font-size: 1.2rem;
            }
            .sub-weight {
                display: inline-block;
                margin-left: 8px;
            }
            .btn-recalc {
                padding: 10px 20px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .title-section h1 {
                font-size: 1.4rem;
            }
        }

        .animation-fade {
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-section">
            <h1>
                <i data-lucide="calculator"></i> 
                Mathematics Marklist
            </h1>
            <p>
                <i data-lucide="map-pin"></i> Ethiopian National Curriculum · Weighted Assessment
            </p>
        </div>
        <button class="btn-recalc" onclick="calculateAllTotals()">
            <i data-lucide="refresh-cw"></i> Recalculate Totals
        </button>
    </div>

    <!-- Column Labels (Desktop) -->
    <div class="grid-header">
        <span>#</span>
        <span>Full Name</span>
        <span>Test <span class="sub-weight">(10%)</span></span>
        <span>CW <span class="sub-weight">(15%)</span></span>
        <span>HW <span class="sub-weight">(20%)</span></span>
        <span>Part. <span class="sub-weight">(5%)</span></span>
        <span>Exam <span class="sub-weight">(50%)</span></span>
        <span>Total</span>
    </div>

    <div id="studentList" class="student-list">
        <!-- Dynamic rows via JS for easier maintenance but pre-populated with Ethiopian student data -->
    </div>
</div>

<script>
    // Student data: name, test, cw, hw, part, exam
    const studentsData = [
        { name: "Abebe Kebede", test: 8, cw: 12, hw: 18, part: 4, exam: 42 },
        { name: "Mulugeta Tesfaye", test: 9, cw: 14, hw: 19, part: 5, exam: 48 },
        { name: "Hanan Mohammed", test: 6, cw: 10, hw: 15, part: 3, exam: 30 },
        { name: "Selamawit Desta", test: 7, cw: 13, hw: 17, part: 4, exam: 38 },
        { name: "Biruk Alemu", test: 9, cw: 15, hw: 19, part: 5, exam: 45 },
        { name: "Meron Tekle", test: 5, cw: 9, hw: 12, part: 2, exam: 28 },
        { name: "Yonas Tadesse", test: 8, cw: 11, hw: 16, part: 4, exam: 40 }
    ];

    // Weight configuration
    const weights = { test: 0.10, cw: 0.15, hw: 0.20, part: 0.05, exam: 0.50 };
    // Max possible contrib per category (full marks out of respective component)
    // But we treat inputs as raw scores out of 10/15/20/5/50? Actually we directly sum weighted percentage.
    // To match total %: Each component maximum raw? Actually in typical Ethiopian: Test max 10, CW max 15, HW max 20, Part max 5, Exam max 50 -> total 100.
    // Perfect.
    
    function computeTotalPercentage(student) {
        let total = 0;
        total += (student.test || 0);
        total += (student.cw || 0);
        total += (student.hw || 0);
        total += (student.part || 0);
        total += (student.exam || 0);
        return Math.min(100, Math.max(0, total));
    }
    
    // Render the entire student list with icons and lucide integration
    function renderStudentList() {
        const container = document.getElementById('studentList');
        container.innerHTML = '';
        
        studentsData.forEach((student, idx) => {
            const row = document.createElement('div');
            row.className = 'student-row';
            row.dataset.index = idx;
            
            const totalScore = computeTotalPercentage(student);
            const gradeColor = totalScore >= 50 ? 'var(--accent-gold)' : 'var(--danger)';
            
            // Build cells
            row.innerHTML = `
                <div class="cell id-cell"><i data-lucide="hash" style="width: 14px;"></i> ${idx + 1}</div>
                <div class="cell name-cell"><i data-lucide="user"></i> ${student.name}</div>
                <div class="cell"><input type="number" class="score-input test-input" value="${student.test}" step="0.5" min="0" max="10"></div>
                <div class="cell"><input type="number" class="score-input cw-input" value="${student.cw}" step="0.5" min="0" max="15"></div>
                <div class="cell"><input type="number" class="score-input hw-input" value="${student.hw}" step="0.5" min="0" max="20"></div>
                <div class="cell"><input type="number" class="score-input part-input" value="${student.part}" step="0.5" min="0" max="5"></div>
                <div class="cell"><input type="number" class="score-input exam-input" value="${student.exam}" step="0.5" min="0" max="50"></div>
                <div class="cell total-cell" style="color: ${gradeColor};">
                    <span class="total-value">${totalScore}</span>%
                    ${totalScore < 50 ? '<span class="grade-badge" style="background:#ef444420; color:#ef4444;">Fail</span>' : '<span class="grade-badge" style="background:#22c55e20; color:#22c55e;">Pass</span>'}
                </div>
            `;
            
            // Attach event listeners to inputs for that row
            const inputs = row.querySelectorAll('.score-input');
            inputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    updateStudentFromRow(row, idx);
                    calculateAllTotals(); // recalc all rows for consistency
                });
            });
            
            container.appendChild(row);
        });
        
        // initialize lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    }
    
    // Update student objects from DOM row
    function updateStudentFromRow(row, idx) {
        const testVal = parseFloat(row.querySelector('.test-input')?.value) || 0;
        const cwVal = parseFloat(row.querySelector('.cw-input')?.value) || 0;
        const hwVal = parseFloat(row.querySelector('.hw-input')?.value) || 0;
        const partVal = parseFloat(row.querySelector('.part-input')?.value) || 0;
        const examVal = parseFloat(row.querySelector('.exam-input')?.value) || 0;
        
        studentsData[idx].test = Math.min(10, Math.max(0, testVal));
        studentsData[idx].cw = Math.min(15, Math.max(0, cwVal));
        studentsData[idx].hw = Math.min(20, Math.max(0, hwVal));
        studentsData[idx].part = Math.min(5, Math.max(0, partVal));
        studentsData[idx].exam = Math.min(50, Math.max(0, examVal));
    }
    
    // Recalculate totals for all rows and update UI
    function calculateAllTotals() {
        for (let i = 0; i < studentsData.length; i++) {
            const student = studentsData[i];
            // sync from current DOM inputs first to keep data consistent
            const row = document.querySelector(`.student-row[data-index='${i}']`);
            if (row) {
                updateStudentFromRow(row, i);
            }
        }
        
        // Re-render the entire list to reflect fresh totals (keeps UI consistent)
        // But we'll just update total cells individually for performance, but for simplicity rerender preserves icons.
        // However rerender will lose focus? let's manually update each total cell without full rerender.
        updateTotalCellsOnly();
        
        // small animation for feedback
        const btn = document.querySelector('.btn-recalc');
        if (btn) {
            btn.style.transform = 'scale(0.98)';
            setTimeout(() => { if(btn) btn.style.transform = ''; }, 150);
        }
        showSaveToast();
    }
    
    function updateTotalCellsOnly() {
        for (let i = 0; i < studentsData.length; i++) {
            const student = studentsData[i];
            const totalScore = computeTotalPercentage(student);
            const row = document.querySelector(`.student-row[data-index='${i}']`);
            if (row) {
                const totalCell = row.querySelector('.total-cell');
                const totalValueSpan = totalCell?.querySelector('.total-value');
                const gradeSpan = totalCell?.querySelector('.grade-badge');
                if (totalValueSpan) {
                    totalValueSpan.innerText = totalScore;
                }
                const newColor = totalScore >= 50 ? 'var(--accent-gold)' : 'var(--danger)';
                if (totalCell) totalCell.style.color = newColor;
                if (gradeSpan) {
                    if (totalScore < 50) {
                        gradeSpan.innerText = 'Fail';
                        gradeSpan.style.background = '#ef444420';
                        gradeSpan.style.color = '#ef4444';
                    } else {
                        gradeSpan.innerText = 'Pass';
                        gradeSpan.style.background = '#22c55e20';
                        gradeSpan.style.color = '#22c55e';
                    }
                }
                
                // Also update inputs if limits out of bound visually
                const testInp = row.querySelector('.test-input');
                const cwInp = row.querySelector('.cw-input');
                const hwInp = row.querySelector('.hw-input');
                const partInp = row.querySelector('.part-input');
                const examInp = row.querySelector('.exam-input');
                if (testInp && parseFloat(testInp.value) !== student.test) testInp.value = student.test;
                if (cwInp && parseFloat(cwInp.value) !== student.cw) cwInp.value = student.cw;
                if (hwInp && parseFloat(hwInp.value) !== student.hw) hwInp.value = student.hw;
                if (partInp && parseFloat(partInp.value) !== student.part) partInp.value = student.part;
                if (examInp && parseFloat(examInp.value) !== student.exam) examInp.value = student.exam;
            }
        }
    }
    
    let toastTimeout = null;
    function showSaveToast() {
        let toast = document.getElementById('toast-notify');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast-notify';
            toast.style.position = 'fixed';
            toast.style.bottom = '24px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = '#1e293b';
            toast.style.backdropFilter = 'blur(12px)';
            toast.style.padding = '10px 24px';
            toast.style.borderRadius = '60px';
            toast.style.fontSize = '0.85rem';
            toast.style.fontWeight = '500';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '10px';
            toast.style.border = '1px solid var(--accent-blue)';
            toast.style.color = '#a5f3fc';
            toast.style.zIndex = '999';
            toast.style.fontFamily = 'Poppins, sans-serif';
            document.body.appendChild(toast);
        }
        toast.innerHTML = '<i data-lucide="check-circle" style="width: 18px;"></i> Marks recalculated & saved';
        if (typeof lucide !== 'undefined') lucide.createIcons();
        toast.style.opacity = '1';
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.style.opacity = '0';
        }, 2000);
    }
    
    // auto recalculation on any input (debounced)
    let debounceTimer;
    function autoRecalc() {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            calculateAllTotals();
        }, 50);
    }
    
    // Attach global input listener (delegation)
    document.addEventListener('input', (e) => {
        if (e.target.classList && e.target.classList.contains('score-input')) {
            autoRecalc();
        }
    });
    
    // Init and also add extra Ethiopian touch: class average?
    function addClassAverageRow() {
        const footerDiv = document.createElement('div');
        footerDiv.style.marginTop = '28px';
        footerDiv.style.padding = '16px 20px';
        footerDiv.style.background = 'rgba(17, 24, 39, 0.6)';
        footerDiv.style.borderRadius = '20px';
        footerDiv.style.border = '1px solid var(--border)';
        footerDiv.style.display = 'flex';
        footerDiv.style.justifyContent = 'space-between';
        footerDiv.style.alignItems = 'center';
        footerDiv.style.flexWrap = 'wrap';
        footerDiv.style.gap = '12px';
        
        const avgSpan = document.createElement('div');
        avgSpan.style.display = 'flex';
        avgSpan.style.alignItems = 'center';
        avgSpan.style.gap = '8px';
        avgSpan.innerHTML = `<i data-lucide="bar-chart-3"></i> <strong>Class Average:</strong> <span id="classAverageValue">--</span>%`;
        
        const highestSpan = document.createElement('div');
        highestSpan.style.display = 'flex';
        highestSpan.style.alignItems = 'center';
        highestSpan.style.gap = '8px';
        highestSpan.innerHTML = `<i data-lucide="trophy"></i> <strong>Highest Score:</strong> <span id="highestScoreValue">--</span>%`;
        
        footerDiv.appendChild(avgSpan);
        footerDiv.appendChild(highestSpan);
        document.querySelector('.container')?.appendChild(footerDiv);
        
        // update analytics
        function updateAnalytics() {
            let total = 0;
            let highest = 0;
            studentsData.forEach(s => {
                const score = computeTotalPercentage(s);
                total += score;
                if (score > highest) highest = score;
            });
            const avg = studentsData.length ? (total / studentsData.length).toFixed(1) : 0;
            const avgEl = document.getElementById('classAverageValue');
            const highestEl = document.getElementById('highestScoreValue');
            if (avgEl) avgEl.innerText = avg;
            if (highestEl) highestEl.innerText = highest;
        }
        
        // integrate update after recalc
        const origCalc = window.calculateAllTotals;
        window.calculateAllTotals = function() {
            origCalc();
            updateAnalytics();
        };
        updateAnalytics();
    }
    
    // initial setup
    function init() {
        renderStudentList();
        addClassAverageRow();
        calculateAllTotals();
        // ensure analytics update on load
        setTimeout(() => {
            if (window.calculateAllTotals) window.calculateAllTotals();
        }, 50);
    }
    
    window.calculateAllTotals = calculateAllTotals;
    init();
</script>
</body>
</html>
