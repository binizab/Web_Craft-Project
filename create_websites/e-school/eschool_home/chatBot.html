<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EB Assistant | Pro Sidebar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.98);
            --text-main: #f8fafc;
            --bot-msg: #334155;
            --scrollbar-bg: #1e293b;
            --scrollbar-thumb: #475569;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* 1. Launcher Button */
        #chat-launcher {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--primary-glow);
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #chat-launcher:hover { transform: scale(1.1); }

        /* 2. Sidebar Container */
        #chatbot-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 380px; 
            min-width: 300px;
            max-width: 95vw;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            box-shadow: -15px 0 50px rgba(0, 0, 0, 0.6);
            z-index: 2001;
            display: flex;
            flex-direction: row; /* Needed for the resizer bar on the left */
            transform: translateX(105%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #chatbot-container.open { transform: translateX(0); }

        /* 3. Full-Length Left Resizer */
        #resizer {
            width: 6px;
            height: 100%;
            cursor: ew-resize;
            background: rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        #resizer:hover, .resizing #resizer {
            background: var(--primary);
        }

        /* 4. Chat Content Layout */
        .chat-content-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 1.5rem;
            flex-grow: 1;
            overflow: hidden;
        }

        .chat-header {
            position: relative;
            text-align: center;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .close-chat {
            position: absolute;
            right: 0;
            top: 0;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.3rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-chat:hover { color: #f1f5f9; }

        /* 5. Messages & History */
        #chat-history {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-message {
            max-width: 85%;
            margin: 8px 0;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
        }

        .user-message {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .input-group-custom .form-control {
            background: rgba(15, 23, 42, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 22px 15px !important;
        }

        .btn-send {
            background: var(--primary) !important;
            border: none !important;
            border-radius: 12px !important;
            color: white;
            width: 45px;
            margin-left: 8px;
        }

        /* Scrollbar styling */
        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .resizing { user-select: none; cursor: ew-resize; }
    </style>
</head>
<body>

    <button id="chat-launcher" onclick="toggleChat()">
        <i class="fas fa-comment-dots"></i>
    </button>

    <div id="chatbot-container">
        <div id="resizer"></div>
        
        <div class="chat-content-wrapper">
            <div class="chat-header">
                <button class="close-chat" onclick="toggleChat()" title="Close Assistant">
                    <i class="fas fa-times"></i>
                </button>
                <h5 style="color: white; margin: 0;"><i class="fas fa-robot mr-2"></i>EB Assistant</h5>
            </div>

            <div id="chat-history">
                <div class="chat-message bot-message">
                    Hello! I'm your EB Assistant. How can I help you study today?
                </div>
            </div>

            <div class="input-group-custom">
                <div class="input-group">
                    <input type="text" class="form-control" id="userInput" placeholder="Ask anything..." onkeypress="handleKeyPress(event)" />
                    <div class="input-group-append">
                        <button class="btn btn-send" type="button" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('chatbot-container');
        const resizer = document.getElementById('resizer');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chat-history');

        // Toggle visibility
        function toggleChat() {
            container.classList.toggle('open');
            if(container.classList.contains('open')) {
                setTimeout(() => userInput.focus(), 500);
            }
        }

        // Resizing Logic
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.classList.add('resizing');
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', stopResizing);
        });

        function handleMouseMove(e) {
            if (!isResizing) return;
            const newWidth = window.innerWidth - e.clientX;
            // Min 300px, Max 95% of screen
            if (newWidth > 300 && newWidth < (window.innerWidth * 0.95)) {
                container.style.width = newWidth + 'px';
            }
        }

        function stopResizing() {
            isResizing = false;
            document.body.classList.remove('resizing');
            document.removeEventListener('mousemove', handleMouseMove);
        }

        // Chat Logic
        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // User Message UI
            appendMessage(text, 'user-message');
            userInput.value = '';

            // Bot Loading UI
            const botDiv = appendMessage('<em>Thinking...</em>', 'bot-message');
            scrollToBottom();

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer 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',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'google/gemma-3-4b-it:free',
                        messages: [{ role: 'user', content: text }],
                    }),
                });
                
                const data = await response.json();
                const content = data.choices?.[0]?.message?.content || 'Sorry, I am having trouble connecting.';
                botDiv.innerHTML = marked.parse(content);
            } catch (error) {
                botDiv.innerHTML = '<strong>Error:</strong> Could not reach the AI service.';
            }
            scrollToBottom();
        }

        function appendMessage(content, className) {
            const div = document.createElement('div');
            div.className = `chat-message ${className}`;
            div.innerHTML = content;
            chatHistory.appendChild(div);
            return div;
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
