<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Switch</title>
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer" 
    />
</head>
<style>
    /* * Body styling is added to better visualize the switch 
     * in its initial 'off' (light mode) state.
     */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0; /* Default light background */
        transition: background-color 0.5s;
    }

    /* --- Switch Container --- */
    .switch-container {
        /* This wrapper helps position the slideBox absolutely relative to the slider */
        position: relative;
        display: inline-block; /* Keeps the container snug around the slider */
    }

    /* --- The Track (Slider) --- */
    .slider {
        width: 150px;
        height: 50px;
        background-color: #ccc; /* Default 'off' (light mode) track color */
        border-radius: 30px;
        cursor: pointer;
        transition: background-color 0.5s; /* Smooth track color change */
        /* Optional: Adding a slight shadow */
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2); 
    }

    /* --- The Handle (Slide Box) --- */
    .slideBox {
        width: 50px;
        height: 50px; /* Changed from 20px to 50px for a perfect circle/square fit */
        border-radius: 50%; /* Made it a circle */
        background-color: white; /* Handle color */
        position: absolute;
        top: 0; /* Positioned relative to the track/slider */
        left: 0;
        color: #333; /* Icon color for 'off' state */
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5em; /* Larger icon */
        cursor: pointer;
        transition: transform 0.5s, background-color 0.5s, color 0.5s; 
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); /* Handle shadow */
    }

    /* --- 'On' State Classes --- */
    /* Moves the handle to the right edge */
    .on-state .slideBox {
        transform: translateX(100px); /* 150px (width) - 50px (handle width) = 100px */
        background-color: #2196F3; /* Change handle color when 'on' */
        color: white; /* Change icon color when 'on' */
    }

    /* Changes the track color to reflect the 'on' state (e.g., green/blue for dark mode) */
    .on-state .slider {
        background-color: #2c3e50; /* Dark mode track color */
    }

    /* Changes the icon inside the handle for the 'on' state */
    .on-state .slideBox .fas.fa-sun {
        content: "\f186"; /* Moon icon */
    }

    /* Optional: Body color change for dark mode */
    .dark-mode {
        background-color: #121212;
    }
</style>
<body id="body">
    <div class="switch-container" id="switchContainer">
        <div class="slider" id="slider"></div>
        <div class="slideBox" id="slideBox"><i class="fas fa-sun"></i></div>
    </div>
</body>
<script>
    const switchContainer = document.getElementById("switchContainer");
    const slideBoxDiv = document.getElementById("slideBox");
    const body = document.getElementById("body");

    // Add a state variable or use a class check (using class check is generally cleaner)
    
    switchContainer.addEventListener('click', function() {
        // Toggle the 'on-state' class on the container
        switchContainer.classList.toggle('on-state');
        
        // Optional: Toggle dark mode on the body
        body.classList.toggle('dark-mode');

        // Change the icon based on the current state
        const icon = slideBoxDiv.querySelector('i');
        
        if (switchContainer.classList.contains('on-state')) {
            // If it's 'on', set it to the moon icon (dark mode)
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
        } else {
            // If it's 'off', set it back to the sun icon (light mode)
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
    });

</script>
</html>
