<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Map Locator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent-blue: #00d2ff;
            --bg-dark: #050a18;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #050a18 0%, #0a0f2a 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .branches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .branch-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .branch-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
        }
        
        .branch-card h3 {
            color: var(--accent-blue);
            margin: 0 0 10px 0;
        }
        
        .branch-card p {
            color: #ccc;
            font-size: 0.9rem;
            margin: 5px 0;
        }
        
        .branch-card i {
            margin-right: 8px;
            color: var(--accent-blue);
        }
        
        /* Map Overlay */
        #mapOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .map-window {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        .nav-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 16px;
            border-left: 4px solid var(--accent-blue);
            z-index: 1000;
            pointer-events: none;
        }
        
        .nav-info h3 {
            margin: 0 0 5px 0;
            color: var(--accent-blue);
            font-size: 1rem;
        }
        
        .dist-val {
            color: #10b981;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .dist-label {
            color: #888;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: #ff3366;
            transform: scale(1.1);
        }
        
        .loading {
            text-align: center;
            color: var(--accent-blue);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: white; text-align: center; margin-bottom: 30px;">
            <i class="fas fa-map-marker-alt" style="color: #00d2ff;"></i> 
            Our Branches
        </h1>
        
        <div id="branchesContainer" class="branches-grid">
            <div class="loading">Loading branches...</div>
        </div>
    </div>
    
    <div id="mapOverlay" onclick="closeMap()">
        <div class="map-window" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeMap()">
                <i class="fas fa-times"></i>
            </button>
            <div id="map"></div>
            <div class="nav-info">
                <h3 id="targetName">Branch Name</h3>
                <div class="dist-label">Distance from you</div>
                <div id="distance" class="dist-val">-- km</div>
                <div style="font-size: 10px; color: #666; margin-top: 5px;">📍 Shortest road route (Yellow)</div>
            </div>
        </div>
    </div>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        // Branch Data - Add your branches here
        const branches = [
            {
                name: "Arada Highschool",
                location: "Near St. Yohannes church, Arada",
                coords: [9.0384, 38.7618],
                phone: "09-12-13-14-15",
                telegram: "9-12 Arada"
            },
            {
                name: "Arada Pre-Primary",
                location: "Near Tibeb Edeget School, Arada",
                coords: [9.0415, 38.7580],
                phone: "09-12-13-14-16",
                telegram: "Pre-primary Arada"
            },
            {
                name: "Gulele Pre-Primary",
                location: "Near Asres Leyeh Pension, Gulele",
                coords: [9.0552, 38.7321],
                phone: "09-12-13-14-17",
                telegram: "Pre-primary Gulele"
            },
            {
                name: "Gulele Middle School",
                location: "Near Asres Leyeh Pension, Gulele",
                coords: [9.0560, 38.7330],
                phone: "09-12-13-14-18",
                telegram: "1-8 Gulele"
            },
            {
                name: "Lazarest Elementary",
                location: "Near Lazarest School",
                coords: [9.0350, 38.7600],
                phone: "09-12-13-14-19",
                telegram: "1-6 Gulele no.1"
            },
            {
                name: "Gulele Elementary",
                location: "Near Hiywot Condominium, Gulele",
                coords: [9.0520, 38.7310],
                phone: "09-12-13-14-20",
                telegram: "1-6 Gulele no.2"
            }
        ];
        
        let userLocation = null;
        let currentMap = null;
        
        // Get user's current location
        function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            userLocation = [position.coords.latitude, position.coords.longitude];
                            resolve(userLocation);
                        },
                        (error) => {
                            console.warn("Location error:", error);
                            // Fallback to Addis Ababa center
                            userLocation = [9.0320, 38.7469];
                            resolve(userLocation);
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    userLocation = [9.0320, 38.7469];
                    resolve(userLocation);
                }
            });
        }
        
        // Calculate distance between two points using Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        // Get route from OSRM (Open Source Routing Machine)
        async function getRoute(start, end, map, branchName) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const distanceKm = (route.distance / 1000).toFixed(2);
                    
                    // Update distance display
                    document.getElementById('distance').innerHTML = `${distanceKm} <span style="font-size: 0.8rem;">km</span>`;
                    document.getElementById('targetName').innerHTML = branchName;
                    
                    // Draw the route on map
                    const points = route.geometry.coordinates.map(p => [p[1], p[0]]);
                    
                    // Remove existing layers
                    if (window.routeLayer) {
                        map.removeLayer(window.routeLayer);
                    }
                    
                    // Draw route with yellow color (shortest path)
                    window.routeLayer = L.polyline(points, {
                        color: '#ffd700',  // Yellow for shortest path
                        weight: 6,
                        opacity: 0.9,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);
                    
                    // Add glow effect
                    window.routeGlow = L.polyline(points, {
                        color: '#ffaa00',
                        weight: 12,
                        opacity: 0.3,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);
                    
                    // Fit map to show the entire route
                    map.fitBounds(window.routeLayer.getBounds(), { padding: [50, 50] });
                    
                    return distanceKm;
                } else {
                    throw new Error("No route found");
                }
            } catch (error) {
                console.error("Routing error:", error);
                // Fallback to straight line distance
                const directDist = calculateDistance(start[0], start[1], end[0], end[1]);
                document.getElementById('distance').innerHTML = `${directDist.toFixed(2)} <span style="font-size: 0.8rem;">km (direct)</span>`;
                return directDist;
            }
        }
        
        // Open map for a specific branch
        window.openBranchMap = async function(branch) {
            const overlay = document.getElementById('mapOverlay');
            overlay.style.display = 'flex';
            
            // Get user location
            await getUserLocation();
            
            // Initialize map if not exists
            if (currentMap) {
                currentMap.remove();
            }
            
            currentMap = L.map('map').setView(branch.coords, 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(currentMap);
            
            // Add marker at destination
            const destinationIcon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background-color: #ff3366; width: 30px; height: 30px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px #ff3366;"></div>',
                iconSize: [30, 30],
                popupAnchor: [0, -15]
            });
            
            L.marker(branch.coords, { icon: destinationIcon })
                .addTo(currentMap)
                .bindPopup(`<b>${branch.name}</b><br>${branch.location}`)
                .openPopup();
            
            // Add marker at user location
            if (userLocation) {
                const userIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: '<div style="background-color: #00ff88; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px #00ff88;"></div>',
                    iconSize: [20, 20]
                });
                
                L.marker(userLocation, { icon: userIcon })
                    .addTo(currentMap)
                    .bindPopup('<b>You are here</b>');
                
                // Get and draw the route
                await getRoute(userLocation, branch.coords, currentMap, branch.name);
            } else {
                document.getElementById('distance').innerHTML = 'Location unavailable';
            }
            
            // Add alternative routes (for demo, show a slightly different path)
            if (userLocation) {
                // You can add alternative path visualization here
                // This is a simplified version - in production you'd use OSRM alternatives parameter
                setTimeout(async () => {
                    try {
                        const altUrl = `https://router.project-osrm.org/route/v1/driving/${userLocation[1]},${userLocation[0]};${branch.coords[1]},${branch.coords[0]}?alternatives=true&overview=simplified&geometries=geojson`;
                        const altResp = await fetch(altUrl);
                        const altData = await altResp.json();
                        
                        if (altData.routes && altData.routes.length > 1) {
                            // Draw alternative routes in blue
                            for (let i = 1; i < Math.min(altData.routes.length, 3); i++) {
                                const altRoute = altData.routes[i];
                                const altPoints = altRoute.geometry.coordinates.map(p => [p[1], p[0]]);
                                
                                const altLine = L.polyline(altPoints, {
                                    color: '#3366ff',
                                    weight: 4,
                                    opacity: 0.5,
                                    dashArray: '8, 8'
                                }).addTo(currentMap);
                                
                                // Store for cleanup
                                if (!window.altRoutes) window.altRoutes = [];
                                window.altRoutes.push(altLine);
                            }
                        }
                    } catch (e) {
                        console.log("Alternative routes not available");
                    }
                }, 500);
            }
            
            setTimeout(() => currentMap.invalidateSize(), 200);
        };
        
        // Close map overlay
        window.closeMap = function() {
            document.getElementById('mapOverlay').style.display = 'none';
            // Clean up alternative routes
            if (window.altRoutes) {
                window.altRoutes.forEach(route => {
                    if (currentMap) currentMap.removeLayer(route);
                });
                window.altRoutes = [];
            }
        };
        
        // Render branches list
        async function renderBranches() {
            const container = document.getElementById('branchesContainer');
            container.innerHTML = '';
            
            await getUserLocation();
            
            // Calculate distances and sort branches by proximity
            const branchesWithDistance = branches.map(branch => {
                let distance = Infinity;
                if (userLocation) {
                    distance = calculateDistance(
                        userLocation[0], userLocation[1],
                        branch.coords[0], branch.coords[1]
                    );
                }
                return { ...branch, distance };
            });
            
            // Sort by distance (nearest first)
            branchesWithDistance.sort((a, b) => a.distance - b.distance);
            
            branchesWithDistance.forEach(branch => {
                const card = document.createElement('div');
                card.className = 'branch-card';
                card.onclick = () => openBranchMap(branch);
                
                card.innerHTML = `
                    <h3><i class="fas fa-school"></i> ${branch.name}</h3>
                    <p><i class="fas fa-location-dot"></i> ${branch.location}</p>
                    <p><i class="fas fa-phone"></i> ${branch.phone || 'N/A'}</p>
                    <p><i class="fab fa-telegram"></i> ${branch.telegram || 'N/A'}</p>
                    ${branch.distance !== Infinity ? `<p style="margin-top: 10px; color: #ffd700;"><i class="fas fa-route"></i> ${branch.distance.toFixed(1)} km from you</p>` : ''}
                    <div style="margin-top: 15px; text-align: center;">
                        <span style="color: var(--accent-blue); font-size: 0.85rem;">
                            <i class="fas fa-map-marked-alt"></i> Click to see route →
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        // Initialize on page load
        renderBranches();
        
        // Handle escape key to close map
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMap();
            }
        });
    </script>
</body>
</html>
