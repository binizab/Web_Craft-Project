<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clap Mode Toggle</title>

<style>
:root { --bg: #ffffff; --text: #000000; }
body.dark { --bg: #121212; --text: #ffffff; }

body {
    background: var(--bg);
    color: var(--text);
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    transition: background 0.2s, color 0.2s;
}

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
    text-align: center;
    padding: 20px;
}

#visualizer {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    transition: transform 0.08s ease;
}

#status {
    margin-top: 20px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div id="overlay">
    <h1>Click to enable Clap Control 👏</h1>
</div>

<div id="visualizer">👏</div>
<p id="status">Waiting for clap...</p>

<script>
const overlay = document.getElementById("overlay");
const visualizer = document.getElementById("visualizer");
const statusText = document.getElementById("status");

const THRESHOLD = 0.35;   // clap strength sensitivity

let lastMax = 0;
let isCoolingDown = false;

overlay.addEventListener("click", async () => {
    overlay.style.display = "none";

    statusText.textContent = "Listening for claps... 👏";

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);

        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 1024;

        source.connect(analyser);

        const dataArray = new Float32Array(analyser.fftSize);

        function detectClap() {
            analyser.getFloatTimeDomainData(dataArray);

            let max = 0;

            for (let i = 0; i < dataArray.length; i++) {
                const v = Math.abs(dataArray[i]);
                if (v > max) max = v;
            }

            // visual feedback
            visualizer.style.transform = `scale(${1 + max * 2})`;

            // clap detection logic (important upgrade)
            const isSpike = max > THRESHOLD && max > lastMax * 1.7;

            if (isSpike && !isCoolingDown) {
                document.body.classList.toggle("dark");

                statusText.textContent = "👏 Clap detected! Toggled";

                isCoolingDown = true;

                setTimeout(() => {
                    isCoolingDown = false;
                    statusText.textContent = "Listening for claps... 👏";
                }, 700);
            }

            lastMax = max;

            requestAnimationFrame(detectClap);
        }

        detectClap();

    } catch (err) {
        alert("Microphone access required!");
        console.error(err);
    }
});
</script>

</body>
</html>
