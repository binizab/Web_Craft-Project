<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employees — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Employees</h2><p>Workforce directory</p></div><button class="btn primary"><i data-lucide="plus"></i>Add Employee</button></div><div class="card"><h3>Directory</h3><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Dept</th><th>Status</th></tr></thead><tbody><tr><td>E-101</td><td>Aisha Khan</td><td>Designer</td><td>Product</td><td><span class='badge success'>Active</span></td></tr><tr><td>E-102</td><td>Ravi Patel</td><td>Developer</td><td>Tech</td><td><span class='badge success'>Active</span></td></tr><tr><td>E-103</td><td>Sara Johnson</td><td>Manager</td><td>Sales</td><td><span class='badge warning'>Leave</span></td></tr></tbody></table></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
