<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expenses — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Expenses</h2><p>Recent expense entries</p></div><button class="btn primary"><i data-lucide="plus"></i>Add Entry</button></div><div class="card"><h3>Expense Log</h3><table><thead><tr><th>Date</th><th>Category</th><th>Vendor</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>May 9</td><td>Logistics</td><td>FastShip</td><td>$1,240</td><td><span class='badge success'>Paid</span></td></tr><tr><td>May 8</td><td>Marketing</td><td>Meta Ads</td><td>$3,500</td><td><span class='badge success'>Paid</span></td></tr><tr><td>May 7</td><td>Inventory</td><td>SupplyCo</td><td>$8,900</td><td><span class='badge warning'>Pending</span></td></tr></tbody></table></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
