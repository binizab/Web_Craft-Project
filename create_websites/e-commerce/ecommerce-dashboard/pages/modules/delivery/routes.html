<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Routes — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Routes</h2><p>Optimised delivery routes</p></div></div><div class="list"><div class="list-item"><div class="ico"><i data-lucide="map"></i></div><div class="meta"><strong>Route A</strong><small>12 stops • 4h</small></div><button class="btn primary"><i data-lucide="navigation"></i>View</button></div><div class="list-item"><div class="ico"><i data-lucide="map"></i></div><div class="meta"><strong>Route B</strong><small>8 stops • 3h</small></div><button class="btn primary"><i data-lucide="navigation"></i>View</button></div><div class="list-item"><div class="ico"><i data-lucide="map"></i></div><div class="meta"><strong>Route C</strong><small>18 stops • 6h</small></div><button class="btn primary"><i data-lucide="navigation"></i>View</button></div></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
