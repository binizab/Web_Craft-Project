<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overview — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Delivery Overview</h2><p>Logistics & dispatch</p></div></div><div class="kpi-grid"><div class="kpi"><div class="kpi-icon"><i data-lucide="truck"></i></div><div class="label">Active Shipments</div><div class="val">248</div><div class="delta up"><i data-lucide="arrow-up-right"></i>+18</div></div><div class="kpi"><div class="kpi-icon"><i data-lucide="check-circle"></i></div><div class="label">Delivered Today</div><div class="val">94</div></div><div class="kpi"><div class="kpi-icon"><i data-lucide="map-pin"></i></div><div class="label">In Transit</div><div class="val">132</div></div><div class="kpi"><div class="kpi-icon"><i data-lucide="x-circle"></i></div><div class="label">Failed</div><div class="val">6</div></div></div><div class="grid-2"><div class="card"><h3>Daily Deliveries</h3><div class="bars"><div class="bar" style="height:60%"><span>Mon</span></div><div class="bar" style="height:75%"><span>Tue</span></div><div class="bar" style="height:55%"><span>Wed</span></div><div class="bar" style="height:82%"><span>Thu</span></div><div class="bar" style="height:94%"><span>Fri</span></div><div class="bar" style="height:70%"><span>Sat</span></div><div class="bar" style="height:48%"><span>Sun</span></div></div></div><div class="card"><h3>Top Routes</h3><div class="bar-row"><div class="br"><div class="top"><span>NYC → BOS</span><span>78%</span></div><div class="progress"><div style="width:78%"></div></div></div><div class="br"><div class="top"><span>LA → SFO</span><span>65%</span></div><div class="progress"><div style="width:65%"></div></div></div><div class="br"><div class="top"><span>CHI → DET</span><span>52%</span></div><div class="progress"><div style="width:52%"></div></div></div><div class="br"><div class="top"><span>MIA → ATL</span><span>40%</span></div><div class="progress"><div style="width:40%"></div></div></div></div></div></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
