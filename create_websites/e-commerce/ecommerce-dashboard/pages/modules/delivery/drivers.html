<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drivers — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Drivers</h2><p>Active fleet</p></div></div><div class="card"><h3>Fleet</h3><table><thead><tr><th>ID</th><th>Driver</th><th>Vehicle</th><th>Route</th><th>Status</th></tr></thead><tbody><tr><td>D-12</td><td>Tom Reed</td><td>Van-04</td><td>Route A</td><td><span class='badge success'>On Duty</span></td></tr><tr><td>D-13</td><td>Linda Wu</td><td>Van-07</td><td>Route B</td><td><span class='badge success'>On Duty</span></td></tr><tr><td>D-14</td><td>Mike Cole</td><td>Truck-02</td><td>—</td><td><span class='badge warning'>Off</span></td></tr></tbody></table></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
