<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Returns — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Returns</h2><p>Reverse logistics</p></div></div><div class="card"><h3>Return Requests</h3><table><thead><tr><th>RMA</th><th>Customer</th><th>Item</th><th>Reason</th><th>Status</th></tr></thead><tbody><tr><td>RMA-220</td><td>Marc Lee</td><td>Headphones</td><td>Defective</td><td><span class='badge warning'>Processing</span></td></tr><tr><td>RMA-219</td><td>Lina Park</td><td>Speaker</td><td>Wrong item</td><td><span class='badge success'>Refunded</span></td></tr></tbody></table></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
