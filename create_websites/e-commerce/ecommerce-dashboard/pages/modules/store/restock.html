<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restock Alerts — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Restock Alerts</h2><p>Items needing reorder</p></div></div><div class="list"><div class="list-item"><div class="ico"><i data-lucide="alert-triangle"></i></div><div class="meta"><strong>Bluetooth Speaker</strong><small>8 left</small></div><button class="btn primary"><i data-lucide="refresh-cw"></i>Reorder</button></div><div class="list-item"><div class="ico"><i data-lucide="alert-triangle"></i></div><div class="meta"><strong>Laptop Stand</strong><small>0 left</small></div><button class="btn primary"><i data-lucide="refresh-cw"></i>Reorder</button></div><div class="list-item"><div class="ico"><i data-lucide="alert-triangle"></i></div><div class="meta"><strong>USB-C Cable</strong><small>12 left</small></div><button class="btn primary"><i data-lucide="refresh-cw"></i>Reorder</button></div></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
