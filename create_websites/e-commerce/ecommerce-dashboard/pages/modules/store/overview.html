<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overview — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Store Overview</h2><p>Inventory & stock health</p></div></div><div class="kpi-grid"><div class="kpi"><div class="kpi-icon"><i data-lucide="package"></i></div><div class="label">Total SKUs</div><div class="val">1,284</div><div class="delta up"><i data-lucide="arrow-up-right"></i>+22</div></div><div class="kpi"><div class="kpi-icon"><i data-lucide="check-circle"></i></div><div class="label">In Stock</div><div class="val">1,102</div></div><div class="kpi"><div class="kpi-icon"><i data-lucide="alert-triangle"></i></div><div class="label">Low Stock</div><div class="val">48</div></div><div class="kpi"><div class="kpi-icon"><i data-lucide="x-circle"></i></div><div class="label">Out of Stock</div><div class="val">12</div></div></div><div class="card"><h3>Stock by Category</h3><div class="bars"><div class="bar" style="height:80%"><span>Elec</span></div><div class="bar" style="height:65%"><span>Fashion</span></div><div class="bar" style="height:58%"><span>Home</span></div><div class="bar" style="height:42%"><span>Beauty</span></div><div class="bar" style="height:30%"><span>Sports</span></div><div class="bar" style="height:55%"><span>Toys</span></div></div></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
