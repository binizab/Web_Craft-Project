<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — ShopHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="module-body">
<div class="page-head"><div><h2>Settings</h2><p>Preferences for the Manager workspace</p></div></div><div class="card"><h3>Profile</h3><div class="form-grid"><div><label>Name</label><input value="Manager User"/></div><div><label>Email</label><input value="user@shophub.com"/></div></div><button class="btn primary" style="margin-top:14px"><i data-lucide="save"></i>Save Changes</button></div><div class="card" style="margin-top:14px"><h3>Appearance</h3><button class="btn" onclick="parent.postMessage({type:'toggleTheme'},'*')"><i data-lucide="moon"></i>Toggle Theme</button></div>
<script>
(function(){
  function paint(){ if(window.lucide) window.lucide.createIcons(); }
  var t = (function(){ try{return localStorage.getItem('shophub-theme');}catch(e){return null;} })() || 'light';
  document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='theme'){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  });
  if(document.readyState!=='loading') paint(); else window.addEventListener('DOMContentLoaded', paint);
  window.addEventListener('load', function(){ paint(); try{ parent.postMessage({type:'frameReady'},'*'); }catch(e){} });
})();
</script>
</body>
</html>
